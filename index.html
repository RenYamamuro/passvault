// ============================================================
// 状態
//
// 鍵と復号済みの項目はこのオブジェクトのメモリ上にしか無く、施錠すると捨てる。
// JavaScript では確保した領域をゼロ埋めできないので、そこはネイティブ版に劣る。
// ============================================================

const state = {
  key: null,
  header: null,
  items: [],
  deletions: [],
  findings: [],
  fileHandle: null,   // File System Access API が使える場合の保存先
  fileName: null,
  fileMtime: null,    // 読み込んだ時点の更新時刻。外からの書き換えを見分けるのに使う
  localSavedAt: null, // 端末の中に保存した時刻（ファイルに書けない環境）
  dirty: false,       // どこにも書けていない変更があることを示す
  selection: { kind: 'all' },
  selectedId: null,
  search: '',
  revealed: new Set(),
  lastActivity: Date.now(),
  holds: 0,           // 0 より大きい間は自動施錠しない
  view: 'home',       // 狭い画面で出している面: home | list | detail（広い画面では使わない）
  cursor: -1,         // 一覧でキーボードが指している位置（-1 はまだ触っていない）
  stash: null,        // 施錠時に保存できていなかった変更（暗号化したまま）
};

const CLIPBOARD_CLEAR_SECONDS = 30;

/// 画面の広さによる切り替え（一覧と詳細を並べるか）を、検証から固定するための差し込み口。
/// 検証ページは開いた窓の広さで挙動が変わってしまい、通ったり落ちたりするのを防ぐ。
/// null なら実際の広さに従う。
const layoutOverride = { wide: null };
const canUseFilePicker = typeof window.showSaveFilePicker === 'function';

const settings = {
  get autoLockMinutes() {
    return Number(localStorage.getItem('passvault.autoLockMinutes') ?? 5);
  },
  set autoLockMinutes(value) {
    localStorage.setItem('passvault.autoLockMinutes', String(value));
  },
  /// 一覧の並び順。name（名前順）| recent（更新が新しい順）
  get sort() {
    return localStorage.getItem('passvault.sort') === 'recent' ? 'recent' : 'name';
  },
  set sort(value) {
    localStorage.setItem('passvault.sort', value === 'recent' ? 'recent' : 'name');
  },
  /// 別のタブや別のアプリへ移った時点で施錠する。**既定はオフ。**
  ///
  /// 最初は既定で有効にしていたが、パスワード管理の主な使い方は
  /// 「コピー → ログイン画面のタブへ → 貼り付け → 戻る」で、
  /// この途中で必ず施錠が走り、戻るたびにマスターパスワードを打ち直すことになった。
  /// 席を立つ場合への備えは、時間で施錠する自動ロックがすでに担っている。
  get lockWhenAway() {
    return localStorage.getItem('passvault.lockWhenAway') === 'on';
  },
  set lockWhenAway(value) {
    localStorage.setItem('passvault.lockWhenAway', value ? 'on' : 'off');
  },
  /// 表示。auto（端末の設定に従う）| light | dark
  get theme() {
    try {
      const saved = localStorage.getItem('passvault.theme');
      return saved === 'light' || saved === 'dark' ? saved : 'auto';
    } catch { return 'auto'; }
  },
  set theme(value) {
    try {
      if (value === 'light' || value === 'dark') localStorage.setItem('passvault.theme', value);
      else localStorage.removeItem('passvault.theme');
    } catch { /* 覚えられなくても、いまの画面には当たる */ }
  },
};

/// 表示を当てる。描画前の分は build.py が head で当てているので、ここは切り替えたときと起動時の後始末。
///
/// iPhone の時刻表示まわりの色（theme-color）は、端末の明暗で選ぶ 2 枚を置いてある。
/// 固定にしたときは両方を選んだ側の色にしないと、端末が暗いときに明るい画面の上だけ黒くなる。
const THEME_COLORS = { light: '#f4f3ef', dark: '#121417' };
function applyTheme(theme) {
  const root = document.documentElement;
  if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
  else delete root.dataset.theme;
  for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
    const own = (meta.media ?? '').includes('dark') ? 'dark' : 'light';
    meta.content = THEME_COLORS[theme === 'auto' ? own : theme];
  }
}
applyTheme(settings.theme);

// ============================================================
// 小さな道具
// ============================================================

const $ = selector => document.querySelector(selector);

// 属性としてしか効かない名前。プロパティに代入しても、黙って何も起きない
// （autocorrect は Safari にしかプロパティが無く、他では代入が無視される）。
const ATTRIBUTE_ONLY = new Set(['autocapitalize', 'autocorrect', 'inputmode', 'enterkeyhint',
                                'role', 'tabindex']);
const TEXT_LIKE = new Set(['text', 'password', 'search', 'email', 'url', 'tel', '']);

/// 文字を打つ欄の既定。**秘密を打つ欄なので、全部オフから始める。**
///
/// 付けないと iPhone ではユーザー名の頭文字が勝手に大文字になり、
/// URL や OTP の秘密鍵が自動修正され、打った文字が予測変換の学習にも回る。
/// 欄ごとに付けると必ず付け忘れが出るので、要素の作り方そのものに持たせる。
/// 変えたい欄は、呼ぶときに props で上書きする。
function applyEntryDefaults(node) {
  const isTextArea = node.tagName === 'TEXTAREA';
  if (!isTextArea && !(node.tagName === 'INPUT' && TEXT_LIKE.has(node.getAttribute('type') ?? ''))) return;
  const defaults = { autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', autocomplete: 'off' };
  for (const [name, value] of Object.entries(defaults)) {
    if (!node.hasAttribute(name)) node.setAttribute(name, value);
  }
}

const el = (tag, props = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    // aria-* や data-* のようにハイフンを含む名前は、プロパティとしては設定できない。
    // Object.assign だと黙って無視され、読み上げには何も伝わらないまま気づけない。
    if (key.includes('-') || ATTRIBUTE_ONLY.has(key)) node.setAttribute(key, value);
    else node[key] = value;
  }
  if (tag === 'input' || tag === 'textarea') applyEntryDefaults(node);
  for (const child of [].concat(children)) {
    if (child != null) node.append(child);
  }
  return node;
};

let toastTimer = null;
function toast(message) {
  const node = $('#toast');
  node.textContent = message;
  node.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove('on'), 2600);
  noteActivity();
}

function noteActivity() { state.lastActivity = Date.now(); }

/// 戻り値は成否。押した場所で「コピーした」と見せるために、呼び出し側が知る必要がある。
async function copyPlain(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast(`${label}をコピーしました`);
    return true;
  } catch {
    toast('コピーできませんでした（ブラウザが拒否しました）');
    return false;
  }
}

/// 押したボタンの場でコピーの結果を見せる。
///
/// 画面の下の方に出る通知だけだと、押した場所から目を離して確かめることになる。
/// 手元のボタンが一瞬チェックに変われば、視線を動かさずに済む。
/// 作り直されて消えたボタンには何もしない。
function flashCopied(button, row = null, size = 17) {
  if (!button?.isConnected) return;
  clearTimeout(button.flashTimer);
  if (!button.classList.contains('done')) {
    // 元のアイコンは、最初に押されたときだけ控える。
    // 続けて押された 2 回目に控えると、チェックを「元」と覚えて戻らなくなる。
    button.originalIcon = button.firstElementChild;
    button.replaceChildren(icon('check', size));
    button.classList.add('done');
  }
  row?.classList.add('copied');
  button.flashTimer = setTimeout(() => {
    if (!button.isConnected) return;
    button.classList.remove('done');
    row?.classList.remove('copied');
    button.replaceChildren(button.originalIcon ?? icon('copy', size));
  }, 1400);
}

/// 秘密はしばらくしたら消す。
/// ブラウザにはクリップボード履歴へ「保存するな」と伝える手段がないので、
/// ネイティブ版よりここは弱い。
///
/// 30 秒後に消そうとしても、たいていは断られる。写したあとはログイン画面の
/// タブへ移っているので、この画面が裏にあり、ブラウザが読み取りを許さない。
/// iPhone は操作の最中でなければ読み書きできず、裏ではタイマーも止まる。
/// なので消せなかった分は覚えておき、戻ってきたときと、次に画面を触ったときに消し直す。
let pendingClear = null;   // { text, label, at, timer }
let clipboardReadRefused = false;
let clearingClipboard = false;   // 戻ってきたときは focus と visibilitychange が続けて来る

async function copySecret(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast(`${label}をコピーしました（${CLIPBOARD_CLEAR_SECONDS}秒後に消去）`);
    clearTimeout(pendingClear?.timer);
    pendingClear = { text, label, at: Date.now(),
                     timer: setTimeout(() => clearCopiedSecret(), CLIPBOARD_CLEAR_SECONDS * 1000) };
    return true;
  } catch {
    toast('コピーできませんでした（ブラウザが拒否しました）');
    return false;
  }
}

/// 写した秘密を消す。時間が来ていなければ何もしない。
///
/// 中身が写したものと同じときだけ消す（あとで別のものを写していたら残す）。
/// 読み取りを断られる環境では確かめようがないので、blind のとき（画面を触った瞬間）に限り
/// 確かめずに消す。秘密が残り続けるより、別のものを消すほうがまだよい。
async function clearCopiedSecret({ blind = false, announce = false } = {}) {
  const pending = pendingClear;
  if (!pending || clearingClipboard || Date.now() - pending.at < CLIPBOARD_CLEAR_SECONDS * 1000) return false;
  clearingClipboard = true;
  try {
    return await clearPending(pending, { blind, announce });
  } finally {
    clearingClipboard = false;
  }
}

async function clearPending(pending, { blind, announce }) {
  if (!blind) {
    let current;
    try {
      current = await navigator.clipboard.readText();
    } catch {
      clipboardReadRefused = true;
      return false;
    }
    if (current !== pending.text) { finishClear(pending); return false; }
  }
  try {
    await navigator.clipboard.writeText('');
  } catch {
    return false;   // 操作の最中でない。次に触ったときにやり直す
  }
  finishClear(pending);
  if (announce) toast(`コピーした${pending.label}をクリップボードから消しました`);
  return true;
}

function finishClear(pending) {
  if (pendingClear !== pending) return;
  clearTimeout(pending.timer);
  pendingClear = null;
}

/// 戻ってきたときの消し直し。ここで消せたなら、30 秒では消せていなかったということ。
async function retryClearOnReturn() {
  if (pendingClear) await clearCopiedSecret({ announce: true });
}

// 次に画面を触ったとき。読み取りを断られる環境（iPhone など）は、確かめずに消す。
for (const event of ['click', 'keydown']) {
  document.addEventListener(event, () => {
    if (pendingClear && clipboardReadRefused) clearCopiedSecret({ blind: true, announce: true });
  }, { capture: true, passive: true });
}
window.addEventListener('focus', () => { retryClearOnReturn(); });

const fmtDate = iso => new Date(iso).toLocaleDateString('ja-JP', { year: 'numeric', month: 'short', day: 'numeric' });
const fmtDateTime = iso => new Date(iso).toLocaleString('ja-JP', { dateStyle: 'medium', timeStyle: 'short' });

// ============================================================
// 保管庫の読み書き
// ============================================================

function payload() {
  return { schemaVersion: V.SCHEMA_VERSION, items: state.items, deletions: state.deletions };
}

/// 保管庫を書き込む。**失敗を投げずに返す。**
///
/// 例外を投げっぱなしにすると、呼び出し側で握られずに
/// 「画面には反映されているがファイルには書かれていない」状態が
/// 何も表示されないまま残る。パスワード管理として最悪の失敗の仕方なので、
/// 必ず結果を返して呼び出し側に判断させる。
///
/// 戻り値: { ok, reason?, message?, unsaved? }
async function persist({ force = false } = {}) {
  state.findings = A.audit(state.items);
  if (!state.key || !state.header) return { ok: true };

  let bytes;
  try {
    bytes = await V.seal(payload(), state.key, state.header);
  } catch (caught) {
    state.dirty = true;
    return { ok: false, reason: 'seal', message: `暗号化に失敗しました: ${describe(caught)}` };
  }

  if (!state.fileHandle) {
    // ファイルに書けない環境（iOS の Safari など）。この端末の中に置く。
    //
    // 以前はここで「抱えておく」とだけ返していたが、実際にはメモリ上にしか無く、
    // タブを閉じた時点で消えていた。保存したつもりのものが消えるのは
    // パスワード管理として最悪なので、必ずどこかに書く。
    try {
      await saveLocalVault(bytes, state.fileName ?? 'vault.pvlt');
      state.localSavedAt = V.isoNoMillis();
      state.dirty = false;
      noteActivity();
      hooks.afterPersist?.();
      return { ok: true, local: true };
    } catch (caught) {
      // 端末にも書けない。ここで ok を返すと消える変更を放置することになる。
      state.dirty = true;
      return { ok: false, reason: 'local',
               message: `この端末に保存できませんでした: ${describe(caught)}` };
    }
  }

  if (!force) {
    const conflict = await detectExternalChange();
    if (conflict) {
      state.dirty = true;
      return { ok: false, reason: 'conflict', message: conflict };
    }
  }

  try {
    const writable = await state.fileHandle.createWritable();
    await writable.write(bytes);
    await writable.close();
    state.fileMtime = (await state.fileHandle.getFile()).lastModified;
    state.dirty = false;
    noteActivity();
    hooks.afterPersist?.();
    return { ok: true };
  } catch (caught) {
    state.dirty = true;
    return { ok: false, reason: 'write', message: `ファイルに書けませんでした: ${describe(caught)}` };
  }
}

const describe = error => error?.message ?? String(error);

/// ファイルが自分以外に書き換えられていないかを見る。
///
/// クラウド同期のフォルダに置いている場合、別の端末の変更が降りてくることがある。
/// それに気づかず上書きすると、相手の変更が黙って消える。
async function detectExternalChange() {
  if (state.fileMtime == null) return null;
  try {
    const current = (await state.fileHandle.getFile()).lastModified;
    if (current > state.fileMtime) {
      const when = new Date(current).toLocaleString('ja-JP');
      return `保管庫ファイルが他の場所で変更されています（${when}）。`
           + 'クラウドの同期や、別の端末での編集が考えられます。';
    }
  } catch {
    // 消された・移動されたなど。書き込みのときに改めて失敗するのでここでは通す。
  }
  return null;
}

/// 別の端末の変更を、こちらから取りに行く。
///
/// 保存しようとするまで気づかない作りだと、相手の変更を知らないまま
/// 古い内容を眺めて編集し続けることになる。クラウド同期のフォルダに
/// 置いている場合、相手の変更はこちらに断りなく降りてくる。
///
/// 読み込むかどうかは必ず画面側が訊く。黙って差し替えると編集中の内容が消える。
let pollingRemote = false;
async function pollRemoteChange() {
  if (!state.key || !state.fileHandle || state.fileMtime == null) return false;
  if (state.holds > 0 || pollingRemote || !hooks.onRemoteChange) return false;
  pollingRemote = true;
  try {
    const file = await state.fileHandle.getFile();
    if (file.lastModified <= state.fileMtime) return false;
    return await hooks.onRemoteChange(new Date(file.lastModified));
  } catch {
    // 消された・移動されたなど。保存のときに改めて失敗するのでここでは黙る。
    return false;
  } finally {
    pollingRemote = false;
  }
}

/// 画面から呼ぶ保存。失敗は必ず利用者に見える形にする。
async function save() {
  const result = await persist();
  if (result.ok) return true;

  if (result.reason === 'conflict') {
    // 画面側が用意していれば、上書き／取り込み／何もしない の 3 択を出す。
    if (hooks.onConflict) return hooks.onConflict(result.message);

    // 画面側が用意されていない状況（本来は起きない）。
    // 訊ねる手段が無いまま上書きすると相手の変更を黙って消すので、何もしない。
    toast(`${result.message} 保存を中止しました。`);
    render();
    return false;
  }

  toast(result.message);
  render();
  return false;
}

/// 競合を承知の上で上書きする
async function forceSave() {
  const forced = await persist({ force: true });
  if (forced.ok) { toast('上書きして保存しました'); return true; }
  toast(forced.message);
  render();
  return false;
}

/// いま保存先に入っているファイルの中身を読む（競合の解決に使う）。
///
/// rebase を付けたときだけ「これが今の下敷き」として更新時刻を覚え直す。
/// 読んだだけで覚え直してはいけない。取り込みを途中で取り消したとき、
/// 相手の変更を見なかったことにして、次の保存で黙って踏み潰すことになる。
async function readVaultFileBytes({ rebase = false } = {}) {
  if (!state.fileHandle) return null;
  const file = await state.fileHandle.getFile();
  if (rebase) state.fileMtime = file.lastModified;
  return new Uint8Array(await file.arrayBuffer());
}

/// 相手の中身を取り込む。呼ぶ前に必ず利用者へ内容を見せて確認を取ること。
async function applyMerge(remotePayload) {
  const merged = A.merge(
    { schemaVersion: V.SCHEMA_VERSION, items: state.items, deletions: state.deletions },
    remotePayload
  );
  state.items = merged.payload.items;
  state.deletions = merged.payload.deletions;
  // 取り込んだ結果を書き戻す。相手の変更は既に手元にあるので上書きしてよい。
  const written = await persist({ force: true });
  if (!written.ok) { toast(written.message); render(); return null; }
  return merged.summary;
}

/// 保管庫を暗号化したままファイルとして書き出す。
///
/// ブラウザにはダウンロードが完了したかを知る手段がない。
/// なので「書き出した」と言い切らず、確かめるよう促す。
/// 失敗しうるところは握りつぶさずに必ず画面へ出す。
async function downloadVault({ forSync = false } = {}) {
  const base = (state.fileName ?? 'vault.pvlt').replace(/\.pvlt$/, '');
  // 控えには日付を入れる。本体と同じ名前にすると、どちらが使っている保管庫で
  // どちらが控えなのか区別できなくなる。
  //
  // 同期用は逆に、保管庫と同じ名前でなければならない。クラウド上の
  // 同じファイルに上書きして戻すのが目的なので、名前が変わると別物になる。
  const name = forSync
    ? `${base}.pvlt`
    : `${base}-backup-${V.isoNoMillis().slice(0, 10)}.pvlt`;

  let url = null;
  try {
    const bytes = await V.seal(payload(), state.key, state.header);
    url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));

    // Safari では body に入っていないと click が効かないことがある
    const link = el('a', { href: url, download: name });
    document.body.append(link);
    link.click();
    link.remove();
  } catch (caught) {
    if (url) URL.revokeObjectURL(url);
    toast(`書き出せませんでした: ${describe(caught)}`);
    render();
    return false;
  }
  // 早く解放しすぎるとダウンロードが途中で壊れる
  setTimeout(() => URL.revokeObjectURL(url), 30_000);

  toast(forSync
    ? `${name} を書き出しました。クラウド上の保管庫に上書きしてください`
    : `${name} を書き出しました。ファイルができているか確かめてください`);
  render();
  return true;
}

// ---- この端末に置いておくもの ----
//
// 2 つの用途で IndexedDB を使う。どちらにも鍵とマスターパスワードは入らない。
//
//   handles: File System Access API のハンドル。「このファイルを触る権利」だけ。
//            次に開くときブラウザが許可を訊き直すので、勝手に読まれることもない。
//   vault:   暗号化した保管庫そのもの。ファイルに書けない環境（iOS の Safari）で使う。
//            取り出せてもマスターパスワードが無ければ中身は読めない。

const DB_NAME = 'passvault';
const DB_VERSION = 2;
const HANDLE_STORE = 'handles';
const VAULT_STORE = 'vault';

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      // 版 1 から上がってくる場合があるので、無いものだけ作る
      const db = request.result;
      if (!db.objectStoreNames.contains(HANDLE_STORE)) db.createObjectStore(HANDLE_STORE);
      if (!db.objectStoreNames.contains(VAULT_STORE)) db.createObjectStore(VAULT_STORE);
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

/// 失敗を投げる版。保管庫本体の読み書きに使う。
async function withStore(storeName, mode, action) {
  const db = await openDB();
  try {
    return await new Promise((resolve, reject) => {
      const transaction = db.transaction(storeName, mode);
      const request = action(transaction.objectStore(storeName));
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
      // 書き込みが確定するのは transaction が終わったとき。
      // request.onsuccess だけを見ていると、容量超過のように
      // あとから起きる中断を取りこぼし、書けたつもりになる。
      transaction.onabort = () => reject(transaction.error ?? new Error('保存が中断されました'));
    });
  } finally {
    db.close();
  }
}

/// 失敗を握りつぶす版。ハンドルは無くても動作に支障がないので静かに諦める。
async function tryStore(storeName, mode, action) {
  try {
    return await withStore(storeName, mode, action);
  } catch {
    return undefined;
  }
}

async function rememberVaultHandle(handle) {
  if (!handle) return;
  await tryStore(HANDLE_STORE, 'readwrite', store => store.put(handle, 'last'));
}

async function recallVaultHandle() {
  return tryStore(HANDLE_STORE, 'readonly', store => store.get('last'));
}

async function forgetVaultHandle() {
  await tryStore(HANDLE_STORE, 'readwrite', store => store.delete('last'));
}

/// 端末の中に保管庫を置く。**失敗は投げる**（呼び出し側が握って画面に出す）。
async function saveLocalVault(bytes, name) {
  await withStore(VAULT_STORE, 'readwrite', store =>
    store.put({ bytes, name, savedAt: V.isoNoMillis() }, 'current'));
}

async function loadLocalVault() {
  return tryStore(VAULT_STORE, 'readonly', store => store.get('current'));
}

async function forgetLocalVault() {
  await withStore(VAULT_STORE, 'readwrite', store => store.delete('current'));
}

/// 保存領域を「消さないでほしい」とブラウザに申し出る。
///
/// iOS はしばらく使わないサイトの保存領域を消すことがある。
/// ホーム画面に追加してあると通りやすい。断られても動作は続くので、
/// 通ったかどうかを返して画面側に判断させる。
async function requestDurableStorage() {
  try {
    if (!navigator.storage?.persist) return null;
    if (await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  } catch {
    return null;
  }
}

/// いま読み込み直しても何も失わないか。新しい版へ切り替えるときに使う（build.py）。
function safeToReload() {
  if (state.key || state.dirty || state.holds > 0) return false;
  return [...document.querySelectorAll('#gate input')].every(input => !input.value);
}

function lock() {
  state.key = null;
  state.header = null;
  state.items = [];
  state.deletions = [];
  state.findings = [];
  state.revealed.clear();
  state.selectedId = null;
  state.selection = { kind: 'all' };
  state.search = '';
  state.view = 'home';
  render();
}

/// 保存できていない変更を、暗号化したまま抱えておく。
///
/// 施錠は必ず行う（開けっ放しのほうが危ない）。ただし黙って捨てない。
/// 平文と鍵は捨てるので施錠の意味は保たれ、次に同じパスワードで
/// 解錠できたときだけ中身を取り戻せる。
async function stashUnsaved() {
  if (!state.dirty || !state.key || !state.header) return false;
  try {
    state.stash = {
      bytes: await V.seal(payload(), state.key, state.header),
      header: state.header,
      at: V.isoNoMillis(),
    };
    return true;
  } catch {
    return false;
  }
}

/// 自動施錠。保存できていない変更があれば、まず保存を試み、
/// それでも駄目なら暗号化して抱えてから施錠する。
async function lockForIdle() {
  let stashed = false;
  if (state.dirty) {
    const written = await persist();
    if (!written.ok || state.dirty) stashed = await stashUnsaved();
  }
  lock();
  toast(stashed
    ? '自動的に施錠しました。保存できていない変更は預かってあります'
    : '自動的に施錠しました');
}

/// 解錠したあと、預かっていた変更があれば取り戻せるか調べる。
/// 同じパスワードでなければ開けないので、取り違えは起きない。
async function recoverStash(key) {
  if (!state.stash) return null;
  const { bytes, header, at } = state.stash;
  try {
    const recovered = await V.open(bytes, key, header);
    return { payload: recovered, at };
  } catch {
    // 別の保管庫、あるいはパスワードを変えた後。取り戻せないので捨てる。
    state.stash = null;
    return null;
  }
}

// ============================================================
// 入口の画面
// ============================================================

function renderGate(mode) {
  const gate = $('#gate');
  gate.style.display = 'grid';
  $('#app').classList.remove('on');
  const card = mode === 'create' ? createCard() : unlockCard();
  // 解錠の画面から作成へ来たときの帰り道。無いと、保管庫があるのに戻れない。
  if (mode === 'create' && state.pendingBytes) {
    card.append(el('div', { style: 'height:8px' }),
      el('button', { className: 'push', textContent: 'ロック画面に戻る', onclick: () => renderGate('unlock') }));
  }
  // 解錠前でも版が分かるように。画面の不具合で設定に届かないとき、確かめる手段がこれしかない。
  if (window.PASSVAULT_BUILD) {
    card.append(el('p', { className: 'gate-version', textContent: `版 ${window.PASSVAULT_BUILD}` }));
  }
  gate.replaceChildren(card);
  // 前回の保管庫があれば、あとから差し込む（IndexedDB の読みは非同期なので）
  if (!state.pendingBytes) offerRememberedVault(card);
}

async function offerRememberedVault(card) {
  const handle = await recallVaultHandle();
  if (!handle) { await offerLocalVault(card); return; }
  if (state.pendingBytes) return;

  const button = el('button', { className: 'push', textContent: `前回の保管庫を開く（${handle.name}）` });
  button.onclick = async () => {
    button.disabled = true;
    try {
      // 一度閉じたあとは許可が切れているので、その場で訊き直す。
      // 利用者のクリックが起点でないとブラウザが訊いてくれない。
      let permission = await handle.queryPermission({ mode: 'readwrite' });
      if (permission !== 'granted') {
        permission = await handle.requestPermission({ mode: 'readwrite' });
      }
      if (permission !== 'granted') {
        toast('ファイルへのアクセスが許可されませんでした');
        button.disabled = false;
        return;
      }
      const file = await handle.getFile();
      state.fileHandle = handle;
      state.fileName = file.name;
      state.fileMtime = file.lastModified;
      state.pendingBytes = new Uint8Array(await file.arrayBuffer());
      renderGate('unlock');
    } catch (caught) {
      toast(`開けませんでした: ${caught.message ?? caught}`);
      await forgetVaultHandle();
      button.remove();
    }
  };

  offerButton(card, button);
}

/// 利用者が自分で「新しい保管庫をつくる」を選んだか。
/// 選んでいないのに作成の画面から始めると、保管庫があるのに毎回
/// 「保管庫をつくる」と出て、ボタンを探して押し直すことになる。
let choseCreate = false;

/// ファイルに書けない環境（iOS の Safari など）で、この端末に置いた保管庫を出す。
async function offerLocalVault(card) {
  if (state.pendingBytes) return;
  const local = await loadLocalVault();
  if (!local?.bytes) return;
  if (state.pendingBytes || state.key || !card.isConnected) return;  // 読んでいる間に画面が進んだ

  const when = local.savedAt ? fmtDateTime(local.savedAt) : '時刻不明';
  const button = el('button', { className: 'push',
                                textContent: `この端末の保管庫を開く（${when}）` });
  button.onclick = () => {
    state.fileHandle = null;
    state.fileName = local.name ?? 'vault.pvlt';
    state.fileMtime = null;
    state.localSavedAt = local.savedAt ?? null;
    state.pendingBytes = new Uint8Array(local.bytes);
    renderGate('unlock');
  };
  // この端末に保管庫があるなら、そのまま解錠の画面へ進む。
  // ファイルの場合と違って、開くのに利用者の操作（許可）が要らない。
  if (!choseCreate) { button.onclick(); return; }
  offerButton(card, button);
}

/// 「新しい保管庫をつくる」より上に差し込む
function offerButton(card, button) {
  card.insertBefore(button, card.querySelector('.tip') ?? null);
  card.insertBefore(el('div', { style: 'height:8px' }), button.nextSibling);
}

/// パスワード欄に「表示」の切り替えを付ける。
///
/// 12 文字以上を伏せ字のまま打つのは、特にスマホでつらい。
/// 打ち間違えに気づけず、作成時は間違ったまま保管庫の鍵になってしまう。
function revealable(input) {
  const button = el('button', {
    type: 'button', className: 'iconbtn reveal', title: '表示',
    'aria-label': 'パスワードを表示', 'aria-pressed': 'false',
  }, [icon('eye', 17)]);
  button.onclick = () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    button.replaceChildren(icon(show ? 'eyeOff' : 'eye', 17));
    button.setAttribute('aria-pressed', String(show));
    button.setAttribute('aria-label', show ? 'パスワードを隠す' : 'パスワードを表示');
    button.title = show ? '隠す' : '表示';
    input.focus();
  };
  return el('div', { className: 'revealable' }, [input, button]);
}

function unlockCard() {
  const password = el('input', { className: 'field', type: 'password', placeholder: 'マスターパスワード' });
  const error = el('div', { className: 'error' });
  const button = el('button', { className: 'push primary', textContent: 'ロック解除' });

  const card = el('div', { className: 'gate-card' }, [
    el('div', { className: 'gate-mark' }, [icon('lock', 40)]),
    el('h1', { textContent: 'ロック中' }),
    el('p', { className: 'lead', textContent: state.fileName ?? '保管庫ファイルを選んでください。' }),
    revealable(password), error, button,
    el('div', { style: 'height:8px' }),
    el('button', { className: 'push', textContent: '別の保管庫ファイルを開く', onclick: pickVaultFile }),
    el('div', { style: 'height:8px' }),
    el('button', { className: 'push', textContent: '新しい保管庫をつくる', onclick: () => {
      choseCreate = true;
      renderGate('create');
    } }),
  ]);

  async function submit() {
    if (!state.pendingBytes) { error.textContent = '保管庫ファイルを選んでください。'; return; }
    if (!password.value) return;
    button.disabled = true;
    button.textContent = '確認中…';
    error.textContent = '';
    try {
      // 施錠中にファイルが外で変わっているかもしれない（クラウド同期など）。
      // 最初に読んだ内容のまま開くと、古い中身を編集することになる。
      if (state.fileHandle) {
        try { state.pendingBytes = await readVaultFileBytes({ rebase: true }) ?? state.pendingBytes; }
        catch { /* 読めなければ手元の内容で試す */ }
      }
      const header = V.decodeHeader(state.pendingBytes);
      const key = await V.deriveKey(password.value, header);
      const opened = await V.open(state.pendingBytes, key, header);
      password.value = '';
      state.key = key;
      state.header = header;
      state.items = opened.items;
      state.deletions = opened.deletions;
      state.findings = A.audit(state.items);

      // 施錠時に保存できていなかった変更があれば、戻すかどうか訊く
      const held = await recoverStash(key);
      if (held) {
        const restore = await hooks.askConfirm?.(
          '保存されていない変更があります',
          `${new Date(held.at).toLocaleString('ja-JP')} に施錠したとき、`
          + 'ファイルに書けていない変更が残っていました。取り戻しますか。',
          { confirmLabel: '取り戻す' });
        state.stash = null;
        if (restore) {
          state.items = held.payload.items;
          state.deletions = held.payload.deletions;
          state.findings = A.audit(state.items);
          state.dirty = true;
          const written = await persist();
          toast(written.ok && !state.dirty
            ? '保存されていない変更を取り戻して保存しました'
            : '取り戻しました。まだファイルに書けていません');
        }
      }
      // 古い形式で保存されていたら、現行形式に書き戻す
      // 古い形式で保存されていたら現行形式に書き戻す。
      // 失敗しても開くのは妨げないが、黙って済ませずに知らせる。
      if (opened.schemaVersion < V.SCHEMA_VERSION) {
        const written = await persist();
        if (!written.ok) toast(`形式の書き戻しに失敗しました: ${written.message}`);
      }
      noteActivity();
      render();
      hooks.afterUnlock?.();
    } catch (caught) {
      error.textContent = caught.message ?? String(caught);
      button.disabled = false;
      button.textContent = 'ロック解除';
      password.value = '';
    }
  }
  button.onclick = submit;
  password.onkeydown = event => { if (event.key === 'Enter') submit(); };
  setTimeout(() => password.focus(), 0);
  return card;
}

function createCard() {
  const first = el('input', { className: 'field', type: 'password', placeholder: 'マスターパスワード' });
  const second = el('input', { className: 'field', type: 'password', placeholder: 'もう一度入力' });
  const hintLength = el('div', { className: 'hint' });
  const hintMatch = el('div', { className: 'hint' });
  const error = el('div', { className: 'error' });
  const button = el('button', { className: 'push primary', textContent: '保管庫を作成', disabled: true });

  function validate() {
    const longEnough = first.value.length >= 12;
    const same = first.value.length > 0 && first.value === second.value;
    const mark = (node, ok, label) => {
      node.className = `hint ${ok ? 'ok' : ''}`;
      // 未達は「×」ではなく空の丸にする。まだ入力していないだけの状態を
      // 間違いとして見せない。
      node.replaceChildren(icon(ok ? 'check' : 'circle', 13), label);
    };
    mark(hintLength, longEnough, '12文字以上');
    mark(hintMatch, same, '2回の入力が一致');
    button.disabled = !(longEnough && same);
  }
  first.oninput = second.oninput = validate;
  validate();

  button.onclick = async () => {
    button.disabled = true;
    button.textContent = '鍵を生成中…';
    error.textContent = '';
    try {
      state.header = V.makeHeader();
      state.key = await V.deriveKey(first.value, state.header);
      state.items = [];
      state.deletions = [];
      state.findings = [];
      first.value = second.value = '';

      if (canUseFilePicker) {
        const handle = await window.showSaveFilePicker({
          suggestedName: 'vault.pvlt',
          types: [{ description: 'Keystone の保管庫', accept: { 'application/octet-stream': ['.pvlt'] } }],
        });
        state.fileHandle = handle;
        state.fileName = handle.name;
        state.fileMtime = (await handle.getFile()).lastModified;
        await rememberVaultHandle(handle);
      } else {
        state.fileName = 'vault.pvlt';
      }
      // 最初の書き込みが失敗したら、作れたつもりにさせてはいけない。
      // 中身は空でも、ここで気づかないと以後の変更が全部宙に浮く。
      const written = await persist();
      if (!written.ok) {
        error.textContent = `保管庫を作成できませんでした。${written.message}`;
        state.key = null;
        state.header = null;
        state.fileHandle = null;
        await forgetVaultHandle();
        button.disabled = false;
        button.textContent = '保管庫を作成';
        validate();
        return;
      }
      noteActivity();
      render();
      if (!state.fileHandle) {
        // 端末の中に置いた。iOS はしばらく使わないと消すことがあるので、
        // 消さないよう申し出たうえで、控えを勧める。
        const durable = await requestDurableStorage();
        toast(durable
          ? 'この端末の中に保存しました。控えの書き出しもときどき行ってください'
          : 'この端末の中に保存しました。ブラウザの都合で消えることがあるので、控えを書き出してください');
      }
    } catch (caught) {
      error.textContent = caught.message ?? String(caught);
      state.key = null;
      button.disabled = false;
      button.textContent = '保管庫を作成';
      validate();
    }
  };

  return el('div', { className: 'gate-card' }, [
    el('div', { className: 'gate-mark' }, [icon('keystone', 44)]),
    el('h1', { textContent: '保管庫をつくる' }),
    el('p', { className: 'lead', textContent: 'マスターパスワードだけがこの保管庫を開ける鍵です。どこにも保存されないので、忘れると中身は取り出せません。' }),
    revealable(first), revealable(second),
    el('div', { className: 'hints' }, [hintLength, hintMatch]),
    error, button,
    el('div', { style: 'height:8px' }),
    el('button', { className: 'push', textContent: '既にある保管庫を開く', onclick: pickVaultFile }),
    el('p', { className: 'tip', textContent: 'ヒント: 覚えやすい単語を4〜5個つないだ長い文（例: 紫の 亀 が 図書館 で 走る）は、記号混じりの短いパスワードより安全で覚えやすいです。' }),
    el('p', { className: 'tip', textContent: '保管庫のファイル（.pvlt）は暗号化されたデータなので、ダブルクリックしても開きません。いつもこの画面から選んで開いてください。' }),
  ]);
}

async function pickVaultFile() {
  try {
    let file;
    if (typeof window.showOpenFilePicker === 'function') {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'Keystone の保管庫', accept: { 'application/octet-stream': ['.pvlt'] } }],
      });
      state.fileHandle = handle;
      await rememberVaultHandle(handle);
      file = await handle.getFile();
    } else {
      file = await pickViaInput();
      state.fileHandle = null;
    }
    state.pendingBytes = new Uint8Array(await file.arrayBuffer());
    state.fileName = file.name;
    state.fileMtime = file.lastModified;
    renderGate('unlock');
  } catch { /* 選択の取り消し */ }
}

function pickViaInput() {
  return new Promise((resolve, reject) => {
    const input = el('input', { type: 'file', accept: '.pvlt,application/octet-stream' });
    input.onchange = () => input.files[0] ? resolve(input.files[0]) : reject();
    input.click();
  });
}

// ============================================================
// 一覧の絞り込み
// ============================================================

const activeItems = () => state.items.filter(item => !item.trashedAt);
const trashedItems = () => state.items.filter(item => item.trashedAt);

function allTags() {
  return [...new Set(activeItems().flatMap(item => item.tags))]
    .filter(Boolean).sort((a, b) => a.localeCompare(b, 'ja'));
}

function itemsFor(selection) {
  switch (selection.kind) {
    case 'all': return activeItems();
    case 'favorites': return activeItems().filter(item => item.isFavorite);
    case 'codes': return activeItems().filter(item => item.oneTimePasswordSecret);
    case 'category': return activeItems().filter(item => item.category === selection.value);
    case 'tag': return activeItems().filter(item => item.tags.includes(selection.value));
    case 'watchtower': {
      const flagged = new Set(state.findings.map(finding => finding.itemId));
      return activeItems().filter(item => flagged.has(item.id));
    }
    case 'trash': return trashedItems();
    default: return activeItems();
  }
}

function visibleItems() {
  const found = itemsFor(state.selection).filter(item => V.matches(item, state.search));
  if (settings.sort === 'recent') {
    // 同時刻なら名前順にして、並びがぶれないようにする
    return found.sort((a, b) => Date.parse(b.updatedAt) - Date.parse(a.updatedAt)
      || V.displayTitle(a).localeCompare(V.displayTitle(b), 'ja'));
  }
  return found.sort((a, b) => V.displayTitle(a).localeCompare(V.displayTitle(b), 'ja'));
}

const selectionTitle = selection => ({
  all: 'すべて', favorites: 'お気に入り', codes: 'コード', watchtower: 'セキュリティ', trash: '削除済み',
  category: V.CATEGORIES[selection.value]?.name, tag: selection.value,
}[selection.kind] ?? 'すべて');

const sameSelection = (a, b) => a.kind === b.kind && a.value === b.value;

// ============================================================
// 描画
// ============================================================

let lastShownItemId = null;

/// 広い画面では、一覧と詳細を左右に並べる。
///
/// 並べない画面（狭い画面・中身が空の保管庫）では、一覧と詳細が切り替わる 1 面。
/// 空のときに並べないのは、初回の案内を右側の空白と並べて見せる意味がないため。
const WIDE_QUERY = '(min-width: 1000px)';
const isWide = () => layoutOverride.wide ?? window.matchMedia(WIDE_QUERY).matches;
const isSplit = () => isWide() && (activeItems().length > 0 || trashedItems().length > 0);

/// 一覧と詳細の描き先。並べるときは専用のペイン、そうでなければ #main そのもの。
/// 広い画面は Apple の「パスワード」と同じく、サイドバー・一覧・詳細の 3 列。
const listHost = () => (isSplit() ? $('#main .pane-list') : $('#main'));
const detailHost = () => (isSplit() ? $('#main .pane-detail') : $('#main'));

/// 並べる／並べないの構造を整える。
/// ペインは作り直さず、あれば使い回す。作り直すと一覧のスクロール位置が先頭に戻る。
function ensureLayout(split) {
  const main = $('#main');
  const has = main.classList.contains('split');
  if (split && !has) {
    main.replaceChildren(
      el('section', { className: 'pane-side', 'aria-label': '区分' }),
      el('section', { className: 'pane-list', 'aria-label': '項目の一覧' }),
      el('section', { className: 'pane-detail', 'aria-label': '項目の詳細' }),
    );
    main.classList.add('split');
  } else if (!split && has) {
    main.replaceChildren();
    main.classList.remove('split');
  }
}

const FOCUSABLE = 'button, a[href], input, select, textarea, summary';

/// 作り直す前に、いまどこにフォーカスがあったかを控える。
///
/// 画面は要素ごと作り直すので、何もしないとフォーカスが消える。
/// 「表示」を押した直後にキーボードの位置が失われ、また最初から Tab で辿り直す羽目になる。
function focusSnapshot() {
  const active = document.activeElement;
  if (!active || active.closest('dialog')) return null;
  for (const selector of ['#bar', '#main']) {
    const container = $(selector);
    if (container && container.contains(active)) {
      return { selector, index: [...container.querySelectorAll(FOCUSABLE)].indexOf(active) };
    }
  }
  return null;
}

function restoreFocus(snapshot) {
  if (!snapshot || snapshot.index < 0) return;
  [...$(snapshot.selector).querySelectorAll(FOCUSABLE)][snapshot.index]?.focus({ preventScroll: true });
}

/// 読み上げ用の目印。要素は 3 か所の HTML に書いてあるので、
/// 食い違わないよう JS から一度だけ付ける（何度呼んでも同じ結果）。
function markLandmarks() {
  $('#bar')?.setAttribute('role', 'banner');
  $('#main')?.setAttribute('role', 'main');
  const toastNode = $('#toast');
  if (toastNode) {
    // 「コピーしました」などが読み上げられるようにする。無いと結果が音声に出ない。
    toastNode.setAttribute('role', 'status');
    toastNode.setAttribute('aria-live', 'polite');
    toastNode.setAttribute('aria-atomic', 'true');
  }
}

let lastScreen = '';
let savedListScroll = 0;

/// 大きな見出しがスクロールで隠れたら、上の帯に小さく題名を出す（iOS の作法）。
let watchingScroll = false;
function watchScroll() {
  if (watchingScroll) return;
  watchingScroll = true;
  $('#main').addEventListener('scroll', updateBarTitle, { passive: true });
}
function updateBarTitle() {
  $('#bar')?.classList.toggle('scrolled', !isSplit() && $('#main').scrollTop > 40);
}

function render() {
  markLandmarks();

  // 別の項目に移ったら、表示にしていた欄を伏せ字に戻す。
  // 解除したままだと、画面を人に見せたときに前の項目の中身まで出てしまう。
  if (state.selectedId !== lastShownItemId) {
    state.revealed.clear();
    lastShownItemId = state.selectedId;
  }

  if (!state.key) {
    renderGate(state.pendingBytes ? 'unlock' : 'create');
    return;
  }
  if (!$('#app').classList.contains('on')) {
    // 入口から入った直後。iPhone ではパスワードを打つあいだキーボードが
    // ページ全体を上へ押し上げ、閉じてもそのまま残る。放っておくと
    // 上の帯（＋・設定・ロック）が画面の外に出たままになる。
    document.activeElement?.blur?.();
    window.scrollTo(0, 0);
  }
  $('#gate').style.display = 'none';
  $('#app').classList.add('on');

  const split = isSplit();
  const exists = state.items.some(item => item.id === state.selectedId);

  // 開いていた項目が消えた（削除・取り込みなど）ら、何も無い画面に取り残さない。
  if (!exists) {
    if (state.view === 'detail') state.view = 'list';
    if (split) state.selectedId = null;
  }
  // 並べる画面では、詳細は常に右に出ているので「面」という状態は持たない。
  // 狭い画面から広げたとき、開いていた項目は右側に引き継ぐ。
  if (split) state.view = 'list';
  // 何も入っていない保管庫は、狭い画面ではホーム（移行の入口）を出す
  else if (isEmptyVault()) state.view = 'home';

  const screen = split ? 'split' : `${state.view}:${state.view === 'detail' ? state.selectedId : ''}`;
  const main = $('#main');
  // 一覧から詳細へ進むとき、一覧のスクロール位置を控える（戻ったときに元の場所へ）
  if (screen !== lastScreen && lastScreen.startsWith('list')) savedListScroll = main.scrollTop;

  const snapshot = focusSnapshot();
  ensureLayout(split);
  renderBar(split);
  if (split) { renderSidebar(); renderListView(); renderDetail(); }
  else if (state.view === 'detail') renderDetail();
  else if (state.view === 'home') renderHome();
  else renderListView();

  // 狭い画面で面が変わったら、頭から見せる。詳細から一覧へ戻ったときだけ元の位置へ。
  if (!split && screen !== lastScreen) {
    main.scrollTop = screen.startsWith('list') && lastScreen.startsWith('detail') ? savedListScroll : 0;
  }
  watchScroll();
  updateBarTitle();

  // 同じ画面の描き直しなら、フォーカスを元の位置へ戻す。
  // 画面が切り替わったときは、行き先の頭へ移す（戻ったときは開いていた行へ）。
  if (screen === lastScreen) {
    restoreFocus(snapshot);
  } else if (!split && !document.querySelector('dialog[open]')) {
    if (state.view === 'detail') {
      const heading = $('#main h1');
      if (heading) { heading.tabIndex = -1; heading.focus({ preventScroll: true }); }
    } else if (lastScreen.startsWith('detail')) {
      $(`#main .item-row[data-id="${state.selectedId}"] .item-open`)?.focus({ preventScroll: true });
    }
  }
  lastScreen = screen;
}

/// 上の帯。
///
/// 広い画面: 名前・検索・道具（Mac の「パスワード」のツールバーと同じ並び）。
/// 狭い画面: 戻る・題名・道具。題名は、大きな見出しがスクロールで隠れたときだけ出す
/// （出しっぱなしだと、直下の大きな見出しと同じものが 2 回並んで散らかる）。
function renderBar(split = false) {
  const bar = $('#bar');
  const addButton = el('button', { className: 'iconbtn', title: '新しい項目',
                                   'aria-label': '新しい項目', onclick: openNewItemMenu }, [icon('plus')]);
  const tools = (...extra) => el('div', { className: 'bar-tools' }, [
    ...extra,
    // 狭い画面では帯に置かない（題名と道具が重なるため）。設定画面からも開ける。
    el('button', { className: 'iconbtn gen-tool', title: 'パスワード生成',
                   'aria-label': 'パスワード生成', onclick: openGenerator }, [icon('dice')]),
    el('button', { className: 'iconbtn', title: '設定',
                   'aria-label': '設定', onclick: openSettings }, [icon('gear')]),
    el('button', { className: 'iconbtn', title: 'ロック',
                   'aria-label': 'ロック', onclick: lock }, [icon('lock')]),
  ]);
  const brand = (withName) => el('div', {
    className: 'brand', title: state.dirty ? '保存できていない変更があります' : '',
  }, [
    icon('keystone', 18),
    withName ? el('span', { textContent: 'Keystone' }) : null,
    state.dirty ? el('span', { className: 'unsaved', textContent: '未保存' }) : null,
  ]);
  const back = (label, title, onclick) => el('button', {
    className: 'backbtn', title, 'aria-label': `${label}へ戻る`, onclick,
  }, [icon('back', 18), el('span', { textContent: label })]);
  const barTitle = text => el('div', { className: 'bar-title', 'aria-hidden': 'true', textContent: text });

  if (split) {
    bar.replaceChildren(brand(true), el('div', { className: 'searchwrap' }, [searchField()]), tools(addButton));
    return;
  }

  if (state.view === 'detail') {
    const item = state.items.find(candidate => candidate.id === state.selectedId);
    bar.replaceChildren(
      back(selectionTitle(state.selection), '一覧へ戻る（Esc）', showList),
      barTitle(item ? V.displayTitle(item) : ''),
      tools(),
    );
  } else if (state.view === 'list') {
    bar.replaceChildren(
      back('Keystone', 'ホームへ戻る（Esc）', goHome),
      barTitle(selectionTitle(state.selection)),
      tools(addButton),
    );
  } else {
    bar.replaceChildren(brand(false), barTitle('Keystone'), tools(addButton));
  }
}

/// 区分。Apple の「パスワード」に倣って固定し、サイドバーとホームで同じものを使う。
///
/// 以前のサイドバーは種別とタグを全部並べ、数十件の保管庫ではほとんどの行が「1」の
/// 空の器になった。固定の 6 つなら器は増えない。種別は「中身のあるものだけ」を別に並べる。
const SECTIONS = [
  { selection: { kind: 'all' }, label: 'すべて', icon: 'key', hue: 222 },
  { selection: { kind: 'favorites' }, label: 'お気に入り', icon: 'starFill', hue: 44 },
  { selection: { kind: 'codes' }, label: 'コード', icon: 'clock', hue: 150 },
  { selection: { kind: 'category', value: 'wifi' }, label: 'Wi-Fi', icon: 'wifi', hue: 192 },
  { selection: { kind: 'watchtower' }, label: 'セキュリティ', icon: 'shield', hue: 4 },
  { selection: { kind: 'trash' }, label: '削除済み', icon: 'trash', hue: null },
];

/// 「種別」として並べるもの。中身のある種別だけ。Wi-Fi は固定の区分にあるので除く。
const kindSections = () => Object.keys(V.CATEGORIES)
  .filter(id => id !== 'wifi' && itemsFor({ kind: 'category', value: id }).length > 0)
  .map(id => ({ selection: { kind: 'category', value: id }, label: V.CATEGORIES[id].name,
                icon: CATEGORY_LOOK[id].icon, hue: CATEGORY_LOOK[id].hue }));

const isEmptyVault = () => !activeItems().length && !trashedItems().length;
const hueStyle = hue => (hue == null ? {} : { style: `--hue:${hue}` });

/// 区分を選ぶ。狭い画面では一覧へ進む。
function choose(selection) {
  state.selection = selection;
  state.search = '';
  state.cursor = -1;
  if (!isSplit()) state.view = 'list';
  noteActivity();
  render();
}

/// 狭い画面のホームへ戻る
function goHome() {
  state.view = 'home';
  state.search = '';
  state.cursor = -1;
  noteActivity();
  render();
}

/// 検索欄。広い画面では上の帯に、狭い画面ではホームと一覧の見出しの下に置く。
function searchField() {
  return el('input', {
    id: 'search', type: 'search', placeholder: '検索', value: state.search,
    'aria-label': '検索', enterkeyhint: 'search',
    oninput: event => {
      state.search = event.target.value;
      state.cursor = -1;
      noteActivity();
      if (!isSplit() && state.view === 'home') {
        // ホームで打ち始めたら、全体を対象にした一覧へ移る。打った文字と位置はそのまま。
        state.selection = { kind: 'all' };
        state.view = 'list';
        render();
        const field = $('#search');
        field?.focus();
        field?.setSelectionRange(field.value.length, field.value.length);
      } else {
        // 一覧の中身だけを描き直す。欄ごと作り直すと、打っている途中でフォーカスが消える。
        renderResults();
      }
    },
  });
}

/// 広い画面のサイドバー
function renderSidebar() {
  const row = section => {
    const selected = sameSelection(section.selection, state.selection);
    const count = itemsFor(section.selection).length;
    return el('button', {
      className: `side-row${selected ? ' sel' : ''}`,
      ...(selected ? { 'aria-current': 'true' } : {}),
      onclick: () => choose(section.selection),
    }, [
      el('span', { className: `side-ico${section.hue == null ? ' neutral' : ''}`, 'aria-hidden': 'true',
                   ...hueStyle(section.hue) }, [icon(section.icon, 17)]),
      el('span', { className: 'grow', textContent: section.label }),
      el('span', { className: 'side-n', textContent: count ? String(count) : '' }),
    ]);
  };

  const parts = [el('div', { className: 'side-group' }, SECTIONS.map(row))];
  const kinds = kindSections();
  if (kinds.length) {
    parts.push(el('div', { className: 'side-head', textContent: '種別' }),
               el('div', { className: 'side-group' }, kinds.map(row)));
  }
  // タグから入ってきたときだけ、そのタグを出す（いつもは並べない。検索で絞れる）
  if (state.selection.kind === 'tag') {
    parts.push(el('div', { className: 'side-head', textContent: 'タグ' }),
               el('div', { className: 'side-group' },
                  [row({ selection: state.selection, label: state.selection.value, icon: 'tag', hue: null })]));
  }
  $('#main .pane-side').replaceChildren(el('nav', { className: 'side', 'aria-label': '区分' }, parts));
}

/// 狭い画面のホーム。区分のタイルと、種別の一覧。
function renderHome() {
  const parts = [el('h1', { className: 'large-title', textContent: 'Keystone' }), searchField()];

  if (isEmptyVault()) {
    // 何も入っていないのに 0 のタイルを並べても、押す理由がない。移行の入口を出す。
    parts.push(firstRunBlock());
  } else {
    parts.push(el('div', { className: 'tiles' }, SECTIONS.map(section => {
      const count = itemsFor(section.selection).length;
      return el('button', {
        className: 'tile', 'aria-label': `${section.label} ${count} 件`,
        onclick: () => choose(section.selection),
      }, [
        el('span', { className: 'tile-top' }, [
          el('span', { className: `tile-ico${section.hue == null ? ' neutral' : ''}`, 'aria-hidden': 'true',
                       ...hueStyle(section.hue) }, [icon(section.icon, 18)]),
          el('span', { className: 'tile-n', 'aria-hidden': 'true', textContent: String(count) }),
        ]),
        el('span', { className: 'tile-label', 'aria-hidden': 'true', textContent: section.label }),
      ]);
    })));

    const kinds = kindSections();
    if (kinds.length) {
      parts.push(
        el('div', { className: 'g-title', textContent: '種別' }),
        el('div', { className: 'group' }, kinds.map(section => el('button', {
          className: 'g-row action', onclick: () => choose(section.selection),
        }, [
          el('span', { className: 'avatar small', 'aria-hidden': 'true', ...hueStyle(section.hue) },
             [icon(section.icon, 15)]),
          el('span', { className: 'grow', textContent: section.label }),
          el('span', { className: 'g-n', textContent: String(itemsFor(section.selection).length) }),
          el('span', { className: 'chev', 'aria-hidden': 'true' }, [icon('chevron', 14)]),
        ]))),
      );
    }
  }
  $('#main').replaceChildren(el('div', { className: 'sheet home' }, parts));
}

/// 初めて開いたとき。ここが移行の入口なので、受け身に「＋から」と言うだけにしない。
function firstRunBlock() {
  return el('div', { className: 'empty first' }, [
    el('span', { className: 'big' }, [icon('keystone', 44)]),
    el('span', { className: 'lead', textContent: 'まだ何も入っていません' }),
    el('span', { className: 'sub', textContent:
      '他のアプリを使っていたなら、書き出した CSV から一度に移せます。' }),
    el('div', { className: 'cta' }, [
      el('button', { className: 'push primary', onclick: () => hooks.importFromCSV?.() },
         [icon('download', 16), '他のアプリから取り込む']),
      el('button', { className: 'push', onclick: openNewItemMenu }, [icon('plus', 16), '最初の項目を追加']),
    ]),
    el('span', { className: 'sub small', textContent:
      'マスターパスワードの控えは、設定の「緊急用シート」で紙に残せます。' }),
  ]);
}

/// 一覧。見出し（と狭い画面では検索欄）は一度だけ作り、中身は renderResults が描く。
function renderListView() {
  // 選んでいた区分が空になったら「すべて」へ落とす（最後の 1 件を消したときなど）
  if (!sameSelection(state.selection, { kind: 'all' }) && !state.search
      && !itemsFor(state.selection).length && state.selection.kind !== 'trash') {
    state.selection = { kind: 'all' };
  }

  const title = selectionTitle(state.selection);
  const head = isSplit()
    ? [el('div', { className: 'list-head' }, [el('h2', { textContent: title })])]
    : [el('h1', { className: 'large-title', textContent: title }), searchField()];
  listHost().replaceChildren(el('div', { className: 'sheet' }, [...head, el('div', { className: 'results' })]));
  renderResults();
}

/// 一覧の中身だけを描き直す（検索で 1 文字打つたびに呼ばれる）
function renderResults() {
  const host = $('#main .results');
  if (!host) { renderListView(); return; }
  const items = visibleItems();
  const isTrash = state.selection.kind === 'trash';

  // -1（まだキーボードを触っていない）はそのまま残す。
  // ここで 0 に丸めると、開いた直後から 1 行目が光って選択済みに見える。
  if (state.cursor >= 0) state.cursor = Math.min(state.cursor, items.length - 1);

  const parts = [];
  if (isTrash && trashedItems().length) {
    parts.push(el('div', { className: 'listtools' }, [
      el('button', { className: 'linkbtn', onclick: emptyTrash }, [icon('broom', 14), '削除済みを空にする']),
    ]));
  }

  if (items.length) {
    parts.push(el('div', { className: 'list' }, items.map((item, index) => itemRow(item, index))));
    parts.push(el('div', { className: 'listfoot' }, [
      // 並び順を選べるのは 2 件以上あるときだけ
      items.length > 1
        ? el('button', {
            className: 'linkbtn', title: '並び順を切り替える',
            onclick: () => {
              settings.sort = settings.sort === 'recent' ? 'name' : 'recent';
              renderResults();
            },
          }, [icon('sort', 14), settings.sort === 'recent' ? '更新が新しい順' : '名前順'])
        : el('span'),
      el('span', { textContent: `${items.length} 件` }),
    ]));
  } else if (!state.search && !isTrash && !activeItems().length) {
    parts.push(firstRunBlock());
  } else {
    parts.push(el('div', { className: 'empty' }, [
      el('span', { className: 'big' }, [icon(isTrash ? 'trash' : (state.search ? 'search' : 'inbox'), 38)]),
      el('span', { className: 'lead', textContent:
        isTrash ? '削除済みの項目はありません'
                : (state.search ? `「${state.search}」に一致するものはありません` : 'この区分には何もありません') }),
    ]));
  }
  host.replaceChildren(...parts);
}

async function emptyTrash() {
  const ok = await hooks.askConfirm?.('ゴミ箱を空にする',
    'ゴミ箱の中身を完全に削除します。取り消せません。',
    { confirmLabel: '完全に削除', destructive: true });
  if (!ok) return;
  const removed = trashedItems();
  state.items = state.items.filter(item => !item.trashedAt);
  state.deletions.push(...removed.map(item => ({ id: item.id, deletedAt: V.isoNoMillis() })));
  if (!await save()) return;
  toast('ゴミ箱を空にしました');
  render();
}

function showList() {
  state.view = 'list';
  noteActivity();
  render();
}

/// 種別やタグで絞って一覧へ戻る。詳細から「同じ仲間」へ行くための道。
function filterBy(selection) {
  state.selection = selection;
  state.search = '';
  state.cursor = -1;
  state.view = 'list';
  noteActivity();
  render();
}

/// 保存した項目を、必ず見えるところに出す。
///
/// 検索欄に「git」が残ったまま「Dropbox」を保存すると、右の詳細には Dropbox が出るのに
/// 一覧は GitHub だけ、ということが起きていた（入れた項目がどこにも見えない）。
/// 見えない理由（検索語・区分）を外してから選ぶ。
function revealItem(id) {
  state.selectedId = id;
  if (!visibleItems().some(item => item.id === id)) {
    state.search = '';
    if (!itemsFor(state.selection).some(item => item.id === id)) state.selection = { kind: 'all' };
  }
  if (isSplit()) state.cursor = visibleItems().findIndex(item => item.id === id);
  else state.view = 'detail';
}

function openItem(id) {
  state.selectedId = id;
  if (isSplit()) {
    // 並べる画面では面を切り替えない。キーボードの位置を、開いた項目に合わせる。
    state.cursor = visibleItems().findIndex(item => item.id === id);
  } else {
    state.view = 'detail';
  }
  noteActivity();
  render();
}

/// 色相の候補。等間隔（36°）の 10 色。
/// 色相を 0〜359 の連続値で選ぶと、近い色（紫と赤紫など）が別の色に見えず、
/// 「項目ごとの顔」になっていなかった。離れた色から選べば、違う色は違って見える。
const TILE_HUES = [12, 48, 84, 120, 156, 192, 228, 264, 300, 336];

/// 色相を題名から決める（同じ題名なら、いつ開いても同じ色になる）。
/// FNV-1a。偏りが少なく、短い文字列でもばらける。
function hueFor(text) {
  let hash = 0x811c9dc5;
  for (const char of text.trim().toLowerCase()) {
    hash ^= char.codePointAt(0);
    hash = Math.imul(hash, 0x01000193) >>> 0;
  }
  return TILE_HUES[hash % TILE_HUES.length];
}

/// 項目のタイル。ログインは頭文字、それ以外は種別のアイコン。
///
/// サイトのアイコンは外へ取りに行く通信が要り、どのサイトの口座を持っているかが漏れるので採らない。
/// 通信なしで項目ごとの顔を作れるのが頭文字。同じ青いタイルが並ぶと、一覧で見分ける手がかりにならない。
/// 種別（ログイン以外）は形で見分けるほうが速いので、アイコンのまま。
function avatarFor(item, iconSize = 18) {
  const look = CATEGORY_LOOK[item.category];
  if (item.category !== 'login') {
    return el('span', { className: 'avatar', 'aria-hidden': 'true', style: `--hue:${look.hue}` },
              [icon(look.icon, iconSize)]);
  }
  const title = V.displayTitle(item);
  const [first] = Array.from(title.trim());
  return el('span', {
    className: 'avatar mono', 'aria-hidden': 'true', style: `--hue:${hueFor(title)}`,
    textContent: (first ?? '?').toUpperCase(),
  });
}

function itemRow(item, index) {
  const look = CATEGORY_LOOK[item.category];
  const marks = el('span', { className: 'marks' });
  if (item.oneTimePasswordSecret) {
    const mark = icon('clock', 14); mark.setAttribute('aria-label', 'ワンタイムパスワードあり');
    marks.append(mark);
  }
  if (state.findings.some(finding => finding.itemId === item.id)) {
    const mark = icon('warning', 14); mark.classList.add('warn');
    mark.setAttribute('aria-label', 'セキュリティの指摘あり');
    marks.append(mark);
  }
  if (item.isFavorite) {
    const mark = icon('starFill', 14); mark.classList.add('fav');
    mark.setAttribute('aria-label', 'お気に入り');
    marks.append(mark);
  }

  const isOpen = isSplit() && item.id === state.selectedId;
  const row = el('div', {
    className: `item-row${index === state.cursor ? ' cur' : ''}${isOpen ? ' open' : ''}`,
    'data-id': item.id,
    ...(isOpen ? { 'aria-current': 'true' } : {}),
  }, [
    el('button', {
      className: 'item-open', onclick: () => openItem(item.id),
    }, [
      avatarFor(item, 18),
      el('span', { className: 'lines' }, [
        el('span', { className: 't', textContent: V.displayTitle(item) }),
        V.subtitle(item) ? el('span', { className: 's', textContent: V.subtitle(item) }) : null,
      ]),
      marks,
    ]),
  ]);

  // 一覧から直接コピーできるようにする。9 割はこれで用が済むので、
  // わざわざ詳細を開かせる理由がない。
  const password = V.primaryPassword(item);
  if (password && !item.trashedAt) {
    const quick = el('button', {
      // Tab の停止点は行ごとに 1 つにする（50 件なら 100 回の Tab になるため）。
      // キーボードでは ↑↓ で行を選んで ⌘C が同じ働きをする。
      className: 'quick', tabindex: '-1', title: 'パスワードをコピー',
      'aria-label': `${V.displayTitle(item)} のパスワードをコピー`,
      onclick: async event => {
        event.stopPropagation();
        if (await copySecret(password, 'パスワード')) flashCopied(quick, null, 16);
      },
    }, [icon('copy', 16)]);
    row.append(quick);
  }
  return row;
}

// 詳細と各ダイアログは detail.js 側に置く（この時点では未読込でも動くよう遅延で解決）
const hooks = {};
const renderDetail = () => hooks.renderDetail?.();
const openGenerator = () => hooks.openGenerator?.();
const openSettings = () => hooks.openSettings?.();
const openNewItemMenu = () => hooks.openNewItemMenu?.();

// ============================================================
// 自動施錠
// ============================================================

let lockingForIdle = false;

/// 自動施錠の時間を過ぎているか
function idleExpired(now = Date.now()) {
  if (!state.key || state.holds > 0 || lockingForIdle) return false;
  const minutes = settings.autoLockMinutes;
  return minutes > 0 && now - state.lastActivity >= minutes * 60_000;
}

async function runIdleLock() {
  lockingForIdle = true;
  try { await lockForIdle(); } finally { lockingForIdle = false; }
}

setInterval(() => { if (idleExpired()) runIdleLock(); }, 5000);

// 別の端末の変更を見に行く。ファイルの更新時刻を見るだけなので軽い。
setInterval(() => { pollRemoteChange(); }, 15_000);

// iPhone でキーボードを閉じたあと、押し上げられたページが戻らないことがある。
// 入力欄から離れて、次の入力欄に移っていなければ、ページを元の位置に戻す。
document.addEventListener('focusout', () => {
  setTimeout(() => {
    if (!state.key || document.activeElement?.matches?.('input, textarea, select')) return;
    if (window.scrollY !== 0) window.scrollTo(0, 0);
  }, 60);
});

/// 裏に回るあいだは中身を隠す。iPhone のアプリ切り替え画面や
/// Mac の Mission Control に、項目の一覧が写り込まないように。
const cover = on => document.body.classList.toggle('covered', on);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    // 戻ってきた瞬間に、施錠の時間を過ぎていないか見る。5 秒ごとの見回りを待つと、
    // そのあいだ中身が見えたままになる（iPhone は裏にいるあいだ見回りも止まる）。
    if (idleExpired()) { runIdleLock().finally(() => cover(false)); return; }
    cover(false);
    retryClearOnReturn();
    // 待たずに一度見る。別の端末を触ってから戻ってくる、というのが実際いちばん多い。
    pollRemoteChange();
    hooks.onVisible?.();
    return;
  }
  if (state.key) cover(true);

  // 離れたら施錠する。ダイアログを開いている最中は、
  // 取り込みの file 選択などで一時的に隠れることがあるので触らない。
  if (settings.lockWhenAway && state.key && state.holds === 0) lockForIdle();
});

// ============================================================
// キーボード
// ============================================================
//
// 検索から手を離さずに目的の項目へ行けること。
// この造りだと、探す→選ぶ→コピーが一続きの操作になる。

document.addEventListener('keydown', event => {
  if (!state.key || state.holds > 0) return;   // 施錠中とダイアログ表示中は触らない

  const search = $('#search');
  const typing = document.activeElement?.tagName === 'INPUT'
              || document.activeElement?.tagName === 'TEXTAREA';

  const split = isSplit();

  if (event.key === 'Escape') {
    if (!split && state.view === 'detail') { showList(); event.preventDefault(); return; }
    if (state.search) {
      state.search = '';
      state.cursor = -1;
      // 欄の中身も消す（以前は状態だけ消して、欄には文字が残っていた）
      if (search) search.value = '';
      renderResults();
      search?.focus();
      event.preventDefault();
    } else if (!split && state.view === 'list') {
      goHome();
      event.preventDefault();
    } else if (split && state.selectedId) {
      // 並べているときは、閉じる操作が「選択を外す」になる
      state.selectedId = null;
      state.cursor = -1;
      render();
      event.preventDefault();
    }
    return;
  }

  // ホームでは、文字を打てば検索へ入る（↑↓ で辿る一覧はまだ無い）
  if (state.view === 'home' && !split) {
    if (!typing && event.key.length === 1 && !event.metaKey && !event.ctrlKey && !event.altKey) search?.focus();
    return;
  }
  if (state.view !== 'list') return;

  const items = visibleItems();

  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    if (!items.length) return;
    const step = event.key === 'ArrowDown' ? 1 : -1;
    state.cursor = Math.max(0, Math.min(items.length - 1, state.cursor + step));
    if (split) {
      // 並べているときは、動かすだけで右の詳細が追従する
      openItem(items[state.cursor].id);
    } else {
      renderResults();
    }
    $('.item-row.cur')?.scrollIntoView({ block: 'nearest' });
    event.preventDefault();
    return;
  }

  if (event.key === 'Enter' && items[state.cursor]) {
    // 検索欄で入力中でも開ける。矢印で選んでそのまま Enter が自然な流れ。
    openItem(items[state.cursor].id);
    if (split) {
      // 並べているときは、右の詳細へ入る（Tab で欄を辿れる）
      const heading = $('.pane-detail h1');
      if (heading) { heading.tabIndex = -1; heading.focus({ preventScroll: true }); }
    }
    event.preventDefault();
    return;
  }

  // 選んでいる項目を、開かずに写す。⌘C がパスワード、⌘⇧C がユーザー名。
  // 並べているときは、右に開いている項目も対象にする。
  const target = items[state.cursor]
    ?? (split ? items.find(candidate => candidate.id === state.selectedId) : null);
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'c' && target) {
    if (!window.getSelection()?.toString()) {
      const item = target;
      if (event.shiftKey) {
        const username = V.primaryUsername(item);
        if (username) { copyPlain(username, 'ユーザー名'); event.preventDefault(); }
      } else {
        const password = V.primaryPassword(item);
        if (password) {
          copySecret(password, 'パスワード').then(ok => {
            if (ok) flashCopied($('.item-row.cur .quick') ?? $('.item-row.open .quick'), null, 16);
          });
          event.preventDefault();
        }
      }
    }
    return;
  }

  // 文字を打ったら検索へ吸い込む。どこを触っていても探し始められる。
  if (!typing && event.key.length === 1 && !event.metaKey && !event.ctrlKey && !event.altKey) {
    search?.focus();
  }
});

// 窓の幅が閾値をまたいだら、並べる／切り替えるを組み直す
window.matchMedia?.(WIDE_QUERY).addEventListener?.('change', () => { if (state.key) render(); });

for (const event of ['click', 'keydown', 'pointermove']) {
  document.addEventListener(event, noteActivity, { passive: true });
}

window.addEventListener('beforeunload', event => {
  if (state.dirty) { event.preventDefault(); event.returnValue = ''; }
});

const STRENGTH_COLORS = ['var(--danger)', 'var(--danger)', 'var(--warn)', 'var(--ok)', 'var(--accent)'];

function strengthRow(password) {
  const bits = X.estimateBits(password);
  const level = X.strengthLevel(bits);
  const color = STRENGTH_COLORS[level.rank];
  return el('div', { className: 'strength' }, [
    el('span', { className: 'bar' }, [
      el('i', { style: `width:${Math.min(bits / 128, 1) * 100}%;background:${color}` }),
    ]),
    el('span', { className: 'lv', style: `color:${color}`, textContent: `${level.label}（推定 ${Math.floor(bits)} ビット）` }),
  ]);
}

let otpTimer = null;

hooks.renderDetail = function renderDetail() {
  clearInterval(otpTimer);
  const column = detailHost();
  const item = state.items.find(candidate => candidate.id === state.selectedId);

  if (!item) {
    if (isSplit()) {
      // 並べているときは、何も選んでいない状態が普通にある。右側を空白にせず、次の手を示す。
      column.replaceChildren(el('div', { className: 'sheet' }, [
        el('div', { className: 'empty placeholder' }, [
          el('span', { className: 'big' }, [icon('keystone', 44)]),
          el('span', { className: 'lead', textContent: '項目を選ぶと、中身がここに出ます' }),
          el('span', { className: 'sub', textContent: '↑ ↓ で選べます。⌘C でパスワード、⌘⇧C でユーザー名を写せます。' }),
        ]),
      ]));
      return;
    }
    // render() が一覧へ戻すので普通は通らない。通ったときに空白を残さないための備え。
    column.replaceChildren(el('div', { className: 'sheet' }, [
      el('div', { className: 'empty' }, [
        el('span', { className: 'big' }, [icon('inbox', 38)]),
        el('span', { className: 'lead', textContent: 'この項目は見つかりませんでした' }),
      ]),
    ]));
    return;
  }

  const findings = state.findings.filter(finding => finding.itemId === item.id);
  const parts = [];

  const look = CATEGORY_LOOK[item.category];
  const favButton = el('button', {
    className: `iconbtn${item.isFavorite ? ' on' : ''}`,
    title: item.isFavorite ? 'お気に入りから外す' : 'お気に入りに追加',
    'aria-label': item.isFavorite ? 'お気に入りから外す' : 'お気に入りに追加',
    onclick: async () => { item.isFavorite = !item.isFavorite; item.updatedAt = V.isoNoMillis(); await save(); render(); },
  }, [icon(item.isFavorite ? 'starFill' : 'star', 19)]);
  if (item.isFavorite) favButton.style.color = '#e8b021';

  parts.push(el('div', { className: 'detail-head' }, [
    avatarFor(item, 28),
    el('div', { className: 'grow' }, [
      el('h1', { textContent: V.displayTitle(item) }),
      el('button', {
        className: 'cat', title: `${V.CATEGORIES[item.category].name}だけを見る`,
        onclick: () => filterBy({ kind: 'category', value: item.category }),
        textContent: V.CATEGORIES[item.category].name,
      }),
    ]),
    favButton,
  ]));

  if (item.trashedAt) {
    parts.push(el('div', { className: 'banner quiet' }, [
      icon('trash'),
      el('div', {}, [
        el('div', { className: 'bt', textContent: 'この項目はゴミ箱にあります' }),
        el('div', { className: 'bd', textContent: '元に戻すまで検索結果には出てきません。' }),
      ]),
    ]));
  }

  for (const finding of findings) {
    const kind = A.FINDING_KINDS[finding.kind];
    parts.push(el('div', { className: 'banner' }, [
      icon(FINDING_ICONS[finding.kind]),
      el('div', {}, [
        el('div', { className: 'bt', textContent: kind.title }),
        el('div', { className: 'bd', textContent: finding.detail }),
      ]),
    ]));
  }

  const filled = item.fields.filter(field => field.value.trim());
  if (filled.length) {
    parts.push(el('div', { className: 'card' }, filled.map(field => fieldRow(field))));
  }

  if (item.oneTimePasswordSecret) {
    const otpCard = el('div', { className: 'card' });
    parts.push(otpCard);
    mountOTP(otpCard, item.oneTimePasswordSecret);
  }

  if (item.tags.length) {
    // 押したらそのタグで絞る。札から種別とタグを外したぶん、
    // ここが「同じ仲間を見る」ための入口になる。
    parts.push(el('div', { className: 'tags' },
      item.tags.map(tag => el('button', {
        className: 'tag', title: `「${tag}」で絞り込む`,
        onclick: () => filterBy({ kind: 'tag', value: tag }),
      }, [icon('tag', 12), tag]))));
  }

  if (item.notes) {
    parts.push(el('div', { className: 'lab', style: 'font-size:12px;color:var(--text-2);margin-bottom:4px', textContent: 'メモ' }));
    parts.push(el('div', { className: 'notes', textContent: item.notes }));
  }

  if (item.passwordHistory.length) {
    const list = el('div', { className: 'card' }, item.passwordHistory.map(change =>
      el('div', { className: 'row' }, [
        el('div', { className: 'grow' }, [
          el('div', { className: 'val mono', textContent: change.value }),
          el('div', { className: 'lab', textContent: `${fmtDateTime(change.changedAt)} まで使用` }),
        ]),
        el('button', {
          className: 'iconbtn', title: 'コピー', 'aria-label': '以前のパスワードをコピー',
          onclick: () => copySecret(change.value, '以前のパスワード'),
        }, [icon('copy')]),
      ])));
    parts.push(el('details', { className: 'history' }, [
      el('summary', { textContent: `以前のパスワード（${item.passwordHistory.length}件）` }),
      list,
    ]));
  }

  parts.push(el('div', { className: 'meta', textContent:
    // 並べて出すので書式を揃える。片方だけ和暦風だと目が引っかかる。
    `更新: ${fmtDateTime(item.updatedAt)}　作成: ${fmtDateTime(item.createdAt)}` }));

  const actions = el('div', { className: 'actions' });
  if (item.trashedAt) {
    actions.append(
      el('button', { className: 'push primary', textContent: '元に戻す', onclick: async () => {
        delete item.trashedAt; item.updatedAt = V.isoNoMillis();
        if (!await save()) return;
        toast('元に戻しました'); render();
      } }),
      el('button', { className: 'push', textContent: '完全に削除', onclick: async () => {
        const ok = await hooks.askConfirm('完全に削除',
          `「${V.displayTitle(item)}」を完全に削除します。取り消せません。`,
          { confirmLabel: '完全に削除', destructive: true });
        if (!ok) return;
        state.items = state.items.filter(candidate => candidate.id !== item.id);
        state.deletions.push({ id: item.id, deletedAt: V.isoNoMillis() });
        state.selectedId = null;
        state.view = 'list';
        if (!await save()) return;
        toast('完全に削除しました'); render();
      } }),
    );
  } else {
    actions.append(
      el('button', { className: 'push primary', textContent: '編集', onclick: () => openEditor(item) }),
      el('button', { className: 'push', textContent: 'ゴミ箱に入れる', onclick: async () => {
        item.trashedAt = V.isoNoMillis(); item.updatedAt = item.trashedAt;
        state.selectedId = null;
        state.view = 'list';
        if (!await save()) return;
        toast('ゴミ箱に入れました'); render();
      } }),
    );
  }
  parts.push(actions);

  column.replaceChildren(el('div', { className: 'sheet detail' }, parts));
};

function fieldRow(field) {
  const concealed = V.isConcealed(field.kind);
  const revealed = state.revealed.has(field.id);
  const shown = concealed && !revealed
    ? '•'.repeat(Math.min(Math.max(field.value.length, 8), 24))
    : (field.kind === 'cardNumber' ? V.groupedCardNumber(field.value) : field.value);

  const value = field.kind === 'url'
    ? el('a', { className: 'val', href: normalizeURL(field.value), target: '_blank', rel: 'noreferrer noopener', textContent: field.value })
    : el('div', { className: `val${concealed ? ' mono' : ''}`, textContent: shown });

  const body = el('div', { className: 'grow' }, [
    el('div', { className: 'lab', textContent: field.label }),
    value,
    field.kind === 'password' && field.value ? strengthRow(field.value) : null,
  ]);

  const row = el('div', { className: 'row' }, [body]);
  const copyButton = el('button', {
    className: 'iconbtn', title: 'コピー', 'aria-label': `${field.label}をコピー`,
  }, [icon('copy')]);
  const copy = async () => {
    const copied = concealed ? await copySecret(field.value, field.label)
                             : await copyPlain(field.value, field.label);
    if (copied) flashCopied(copyButton, row);
  };
  copyButton.onclick = copy;

  // 行のどこを押してもコピーできる。一番多い操作なのに、小さなアイコンを狙わせていた。
  // ただし URL の行は、文字がリンクなので行全体にはしない（開くつもりで押して写してしまう）。
  // 範囲選択をしているとき（ユーザー名の一部だけ写したい、など）も何もしない。
  if (field.kind !== 'url') {
    row.classList.add('copyable');
    row.title = 'クリックでコピー';
    row.onclick = event => {
      if (event.target.closest('button, a')) return;
      if (window.getSelection()?.toString()) return;
      copy();
    };
  }
  if (concealed) {
    row.append(el('button', {
      className: 'iconbtn', title: revealed ? '隠す' : '表示',
      'aria-label': revealed ? `${field.label}を隠す` : `${field.label}を表示`,
      onclick: () => {
        revealed ? state.revealed.delete(field.id) : state.revealed.add(field.id);
        hooks.renderDetail();
      },
    }, [icon(revealed ? 'eyeOff' : 'eye')]));
  }
  row.append(copyButton);
  return row;
}

function normalizeURL(value) {
  return value.includes('://') ? value : `https://${value}`;
}

/// ワンタイムパスワード。1 秒ごとに残り時間の輪が縮んでいく。
function mountOTP(container, secret) {
  const config = X.parseOTP(secret);
  if (!config) {
    container.replaceChildren(el('div', { className: 'row' }, [
      icon('warning'),
      el('div', { className: 'grow', textContent: 'ワンタイムパスワードの設定を読み取れませんでした' }),
    ]));
    return;
  }

  const code = el('div', { className: 'code', textContent: '••• •••' });
  const ring = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  ring.setAttribute('viewBox', '0 0 32 32');
  ring.setAttribute('class', 'ring');
  ring.innerHTML =
    '<circle cx="16" cy="16" r="14" fill="none" stroke="var(--hairline)" stroke-width="3"/>' +
    '<circle id="arc" cx="16" cy="16" r="14" fill="none" stroke="var(--accent)" stroke-width="3"' +
    ' stroke-linecap="round" transform="rotate(-90 16 16)"/>' +
    '<text x="16" y="20" text-anchor="middle">0</text>';

  const copyCode = async () => {
    if (await copySecret(await X.otpCode(config), 'ワンタイムパスワード')) flashCopied(copyButton, otpRow);
  };
  const copyButton = el('button', {
    className: 'iconbtn', title: 'コピー', 'aria-label': 'ワンタイムパスワードをコピー',
    onclick: copyCode,
  }, [icon('copy')]);
  const otpRow = el('div', {
    className: 'otp copyable', title: 'クリックでコピー',
    onclick: event => {
      if (event.target.closest('button') || window.getSelection()?.toString()) return;
      copyCode();
    },
  }, [
    el('div', { className: 'grow' }, [
      el('div', { className: 'lab', textContent: 'ワンタイムパスワード' }),
      code,
    ]),
    ring,
    copyButton,
  ]);
  container.replaceChildren(otpRow);

  const circumference = 2 * Math.PI * 14;
  async function tick() {
    const remaining = X.otpSecondsRemaining(config);
    code.textContent = X.formatOTP(await X.otpCode(config));
    code.style.color = remaining <= 5 ? 'var(--warn)' : '';
    const arc = ring.querySelector('#arc');
    arc.setAttribute('stroke-dasharray', String(circumference));
    arc.setAttribute('stroke-dashoffset', String(circumference * (1 - remaining / config.period)));
    arc.setAttribute('stroke', remaining <= 5 ? 'var(--warn)' : 'var(--accent)');
    ring.querySelector('text').textContent = String(remaining);
  }
  tick();
  otpTimer = setInterval(tick, 1000);
}

function openEditor(original, isNew = false) {
  const draft = structuredClone(original);
  const category = V.CATEGORIES[draft.category];
  let tagText = draft.tags.join(', ');
  // 開いた時点の姿。これと違えば「書きかけがある」。
  const snapshot = () => JSON.stringify([draft, tagText]);
  const opened = snapshot();

  const dialog = makeDialog(isNew ? `新規${category.name}` : '編集', async () => {
    const title = draft.title.trim();
    if (!title) { toast('タイトルを入力してください'); return false; }
    draft.tags = tagText.split(',').map(tag => tag.trim()).filter(Boolean);
    draft.oneTimePasswordSecret = draft.oneTimePasswordSecret.trim();
    draft.updatedAt = V.isoNoMillis();

    const index = state.items.findIndex(item => item.id === draft.id);
    if (index >= 0) {
      // パスワードが変わったら、古いものを履歴に残す
      const previous = V.primaryPassword(state.items[index]);
      if (previous && previous !== V.primaryPassword(draft)) {
        draft.passwordHistory = [{ id: crypto.randomUUID(), value: previous, changedAt: V.isoNoMillis() },
                                 ...draft.passwordHistory].slice(0, 20);
      }
      state.items[index] = draft;
    } else {
      state.items.push(draft);
    }
    revealItem(draft.id);
    if (!await save()) return false;   // 失敗したらダイアログを閉じない
    toast('保存しました');
    render();
    return true;
  });

  dialog.isDirty = () => snapshot() !== opened;

  const body = dialog.querySelector('.dlg-body');

  const titleInput = el('input', { className: 'field', value: draft.title, placeholder: category.placeholder,
    oninput: event => { draft.title = event.target.value; } });
  body.append(el('div', { className: 'group' }, [
    el('div', { className: 'g-row' }, [el('span', { className: 'g-lab', textContent: 'タイトル' }), titleInput]),
    el('div', { className: 'g-row between' }, [
      el('span', { textContent: '種別' }),
      el('span', { className: 'inline', style: 'color:var(--text-2)' },
        [icon(CATEGORY_LOOK[draft.category].icon, 15), category.name]),
    ]),
  ]));

  const fieldsGroup = el('div', { className: 'group' });
  const renderFields = () => {
    fieldsGroup.replaceChildren(...draft.fields.map((field, index) => editorField(draft, field, index, renderFields)));
  };
  renderFields();
  if (draft.fields.length) {
    body.append(el('div', { className: 'g-title', textContent: '項目' }), fieldsGroup);
  } else {
    body.append(fieldsGroup);
  }

  body.append(el('div', { className: 'group' }, [
    el('button', { className: 'g-row', style: 'color:var(--accent)',
      textContent: '＋ 欄を追加',
      onclick: async () => {
        const label = await hooks.askText('欄を追加', '欄の名前',
          { placeholder: '例: 復旧コード' });
        if (!label) return;
        draft.fields.push({ id: crypto.randomUUID(), label, value: '', kind: 'text', isCustom: true });
        renderFields();
      } }),
  ]));

  if (category.otp) {
    const preview = el('div', { className: 'lab', style: 'display:flex;align-items:center;gap:5px' });
    const otpInput = el('input', {
      className: 'field', value: draft.oneTimePasswordSecret,
      placeholder: 'otpauth://totp/... または Base32 のシークレット',
      style: 'font-family:ui-monospace,monospace',
      oninput: async event => { draft.oneTimePasswordSecret = event.target.value; await updatePreview(); },
    });
    async function updatePreview() {
      const config = X.parseOTP(draft.oneTimePasswordSecret);
      if (!draft.oneTimePasswordSecret.trim()) { preview.replaceChildren(); return; }
      if (!config) {
        preview.style.color = 'var(--warn)';
        preview.replaceChildren(icon('warning', 13), 'この文字列からはコードを作れません');
        return;
      }
      preview.style.color = 'var(--ok)';
      preview.replaceChildren(icon('check', 13),
        `${X.formatOTP(await X.otpCode(config))}（残り ${X.otpSecondsRemaining(config)} 秒）`);
    }
    updatePreview();
    body.append(
      el('div', { className: 'g-title', textContent: 'ワンタイムパスワード' }),
      el('div', { className: 'group' }, [el('div', { className: 'g-row' }, [otpInput, preview])]),
      el('div', { className: 'g-foot', textContent: '認証アプリの登録画面に出る「手動入力用のキー」か、QRコードの中身（otpauth://…）をそのまま貼り付けてください。' }),
    );
  }

  const tagInput = el('input', { className: 'field', value: tagText, placeholder: 'カンマ区切り（例: 仕事, 経理）',
    oninput: event => { tagText = event.target.value; } });
  const existing = [...new Set(activeItems().flatMap(item => item.tags))].filter(Boolean).sort();
  const suggestions = el('div', { style: 'display:flex;flex-wrap:wrap;gap:6px;margin-top:8px' },
    existing.map(tag => el('button', { className: 'pill', textContent: tag, onclick: () => {
      const tags = tagInput.value.split(',').map(t => t.trim()).filter(Boolean);
      if (!tags.includes(tag)) tags.push(tag);
      tagInput.value = tagText = tags.join(', ');
    } })));
  body.append(
    el('div', { className: 'g-title', textContent: 'タグ' }),
    el('div', { className: 'group' }, [el('div', { className: 'g-row' }, [tagInput, existing.length ? suggestions : null])]),
  );

  const notes = el('textarea', { className: 'field', rows: 4, value: draft.notes,
    oninput: event => { draft.notes = event.target.value; } });
  body.append(
    el('div', { className: 'g-title', textContent: 'メモ' }),
    el('div', { className: 'group' }, [el('div', { className: 'g-row' }, [notes])]),
  );

  dialog.showModal();
  setTimeout(() => titleInput.focus(), 0);
}

function editorField(draft, field, index, refresh) {
  const concealed = V.isConcealed(field.kind);
  const key = `edit-${field.id}`;
  const revealed = state.revealed.has(key);

  const input = field.kind === 'multiline'
    ? el('textarea', { className: 'field', rows: 3, value: field.value })
    : el('input', { className: 'field', type: concealed && !revealed ? 'password' : 'text', value: field.value });
  input.oninput = event => { field.value = event.target.value; if (field.kind === 'password') refreshStrength(); };
  if (concealed) input.style.fontFamily = 'ui-monospace, monospace';

  const strength = el('div');
  const refreshStrength = () => {
    strength.replaceChildren(field.value ? strengthRow(field.value) : el('span'));
  };
  refreshStrength();

  const controls = el('div', { className: 'inline' }, [el('span', { className: 'grow' }, [input])]);
  if (concealed) {
    controls.append(el('button', { className: 'iconbtn',
      title: revealed ? '隠す' : '表示', 'aria-label': revealed ? '隠す' : '表示',
      onclick: () => { revealed ? state.revealed.delete(key) : state.revealed.add(key); refresh(); } },
      [icon(revealed ? 'eyeOff' : 'eye')]));
  }
  if (field.kind === 'password') {
    controls.append(el('button', { className: 'iconbtn', title: 'パスワードを生成',
      'aria-label': 'パスワードを生成',
      onclick: () => hooks.openGenerator(generated => {
        field.value = generated;
        input.value = generated;
        state.revealed.add(key);
        refresh();
      }) }, [icon('dice')]));
  }

  const header = el('div', { className: 'inline' }, [
    el('span', { className: 'g-lab grow', textContent: field.label }),
    field.isCustom ? el('button', { className: 'iconbtn', title: 'この欄を削除',
      'aria-label': 'この欄を削除',
      onclick: () => { draft.fields.splice(index, 1); refresh(); } }, [icon('close', 14)]) : null,
  ]);

  return el('div', { className: 'g-row' }, [header, controls, field.kind === 'password' ? strength : null]);
}
