<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keystone</title>
<script>
// 表示（ライト・ダーク）は描画前に当てる。あとから当てると一瞬ちらつく。
(function () {
  try {
    var saved = localStorage.getItem('passvault.theme');
    if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme-macos.css">
</head>
<body>
<div id="gate"></div>
<div id="app">
  <div id="bar"></div>
  <div id="main"></div>
</div>
<div id="toast"></div>
<script type="module" src="detail.js"></script>
</body>
</html>
