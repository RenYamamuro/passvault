// ============================================================
// 状態
//
// 鍵と復号済みの項目はこのオブジェクトのメモリ上にしか無く、施錠すると捨てる。
// JavaScript では確保した領域をゼロ埋めできないので、そこはネイティブ版に劣る。
// ============================================================

const state = {
  key: null,
  header: null,
  items: [],
  deletions: [],
  findings: [],
  fileHandle: null,   // File System Access API が使える場合の保存先
  fileName: null,
  fileMtime: null,    // 読み込んだ時点の更新時刻。外からの書き換えを見分けるのに使う
  localSavedAt: null, // 端末の中に保存した時刻（ファイルに書けない環境）
  dirty: false,       // どこにも書けていない変更があることを示す
  selection: { kind: 'all' },
  selectedId: null,
  search: '',
  revealed: new Set(),
  lastActivity: Date.now(),
  holds: 0,           // 0 より大きい間は自動施錠しない
  view: 'list',       // いま出している画面: list | detail
  cursor: -1,         // 一覧でキーボードが指している位置（-1 はまだ触っていない）
  stash: null,        // 施錠時に保存できていなかった変更（暗号化したまま）
};

const CLIPBOARD_CLEAR_SECONDS = 30;
const canUseFilePicker = typeof window.showSaveFilePicker === 'function';

const settings = {
  get autoLockMinutes() {
    return Number(localStorage.getItem('passvault.autoLockMinutes') ?? 5);
  },
  set autoLockMinutes(value) {
    localStorage.setItem('passvault.autoLockMinutes', String(value));
  },
  /// 別のタブや別のアプリへ移った時点で施錠する。
  /// 席を立つときに閉じ忘れる、が一番ありがちな漏れ方なので既定で有効。
  get lockWhenAway() {
    return localStorage.getItem('passvault.lockWhenAway') !== 'off';
  },
  set lockWhenAway(value) {
    localStorage.setItem('passvault.lockWhenAway', value ? 'on' : 'off');
  },
};

// ============================================================
// 小さな道具
// ============================================================

const $ = selector => document.querySelector(selector);
const el = (tag, props = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    // aria-* や data-* のようにハイフンを含む名前は、プロパティとしては設定できない。
    // Object.assign だと黙って無視され、読み上げには何も伝わらないまま気づけない。
    if (key.includes('-')) node.setAttribute(key, value);
    else node[key] = value;
  }
  for (const child of [].concat(children)) {
    if (child != null) node.append(child);
  }
  return node;
};

let toastTimer = null;
function toast(message) {
  const node = $('#toast');
  node.textContent = message;
  node.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove('on'), 2600);
  noteActivity();
}

function noteActivity() { state.lastActivity = Date.now(); }

async function copyPlain(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast(`${label}をコピーしました`);
  } catch {
    toast('コピーできませんでした（ブラウザが拒否しました）');
  }
}

/// 秘密はしばらくしたら消す。
/// ブラウザにはクリップボード履歴へ「保存するな」と伝える手段がないので、
/// ネイティブ版よりここは弱い。
async function copySecret(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast(`${label}をコピーしました（${CLIPBOARD_CLEAR_SECONDS}秒で消去）`);
    setTimeout(async () => {
      try {
        if ((await navigator.clipboard.readText()) === text) {
          await navigator.clipboard.writeText('');
        }
      } catch { /* 読み取りが拒否される場合は消せない */ }
    }, CLIPBOARD_CLEAR_SECONDS * 1000);
  } catch {
    toast('コピーできませんでした（ブラウザが拒否しました）');
  }
}

const fmtDate = iso => new Date(iso).toLocaleDateString('ja-JP', { year: 'numeric', month: 'short', day: 'numeric' });
const fmtDateTime = iso => new Date(iso).toLocaleString('ja-JP', { dateStyle: 'medium', timeStyle: 'short' });

// ============================================================
// 保管庫の読み書き
// ============================================================

function payload() {
  return { schemaVersion: V.SCHEMA_VERSION, items: state.items, deletions: state.deletions };
}

/// 保管庫を書き込む。**失敗を投げずに返す。**
///
/// 例外を投げっぱなしにすると、呼び出し側で握られずに
/// 「画面には反映されているがファイルには書かれていない」状態が
/// 何も表示されないまま残る。パスワード管理として最悪の失敗の仕方なので、
/// 必ず結果を返して呼び出し側に判断させる。
///
/// 戻り値: { ok, reason?, message?, unsaved? }
async function persist({ force = false } = {}) {
  state.findings = A.audit(state.items);
  if (!state.key || !state.header) return { ok: true };

  let bytes;
  try {
    bytes = await V.seal(payload(), state.key, state.header);
  } catch (caught) {
    state.dirty = true;
    return { ok: false, reason: 'seal', message: `暗号化に失敗しました: ${describe(caught)}` };
  }

  if (!state.fileHandle) {
    // ファイルに書けない環境（iOS の Safari など）。この端末の中に置く。
    //
    // 以前はここで「抱えておく」とだけ返していたが、実際にはメモリ上にしか無く、
    // タブを閉じた時点で消えていた。保存したつもりのものが消えるのは
    // パスワード管理として最悪なので、必ずどこかに書く。
    try {
      await saveLocalVault(bytes, state.fileName ?? 'vault.pvlt');
      state.localSavedAt = V.isoNoMillis();
      state.dirty = false;
      noteActivity();
      return { ok: true, local: true };
    } catch (caught) {
      // 端末にも書けない。ここで ok を返すと消える変更を放置することになる。
      state.dirty = true;
      return { ok: false, reason: 'local',
               message: `この端末に保存できませんでした: ${describe(caught)}` };
    }
  }

  if (!force) {
    const conflict = await detectExternalChange();
    if (conflict) {
      state.dirty = true;
      return { ok: false, reason: 'conflict', message: conflict };
    }
  }

  try {
    const writable = await state.fileHandle.createWritable();
    await writable.write(bytes);
    await writable.close();
    state.fileMtime = (await state.fileHandle.getFile()).lastModified;
    state.dirty = false;
    noteActivity();
    return { ok: true };
  } catch (caught) {
    state.dirty = true;
    return { ok: false, reason: 'write', message: `ファイルに書けませんでした: ${describe(caught)}` };
  }
}

const describe = error => error?.message ?? String(error);

/// ファイルが自分以外に書き換えられていないかを見る。
///
/// クラウド同期のフォルダに置いている場合、別の端末の変更が降りてくることがある。
/// それに気づかず上書きすると、相手の変更が黙って消える。
async function detectExternalChange() {
  if (state.fileMtime == null) return null;
  try {
    const current = (await state.fileHandle.getFile()).lastModified;
    if (current > state.fileMtime) {
      const when = new Date(current).toLocaleString('ja-JP');
      return `保管庫ファイルが他の場所で変更されています（${when}）。`
           + 'クラウドの同期や、別の端末での編集が考えられます。';
    }
  } catch {
    // 消された・移動されたなど。書き込みのときに改めて失敗するのでここでは通す。
  }
  return null;
}

/// 別の端末の変更を、こちらから取りに行く。
///
/// 保存しようとするまで気づかない作りだと、相手の変更を知らないまま
/// 古い内容を眺めて編集し続けることになる。クラウド同期のフォルダに
/// 置いている場合、相手の変更はこちらに断りなく降りてくる。
///
/// 読み込むかどうかは必ず画面側が訊く。黙って差し替えると編集中の内容が消える。
let pollingRemote = false;
async function pollRemoteChange() {
  if (!state.key || !state.fileHandle || state.fileMtime == null) return false;
  if (state.holds > 0 || pollingRemote || !hooks.onRemoteChange) return false;
  pollingRemote = true;
  try {
    const file = await state.fileHandle.getFile();
    if (file.lastModified <= state.fileMtime) return false;
    return await hooks.onRemoteChange(new Date(file.lastModified));
  } catch {
    // 消された・移動されたなど。保存のときに改めて失敗するのでここでは黙る。
    return false;
  } finally {
    pollingRemote = false;
  }
}

/// 画面から呼ぶ保存。失敗は必ず利用者に見える形にする。
async function save() {
  const result = await persist();
  if (result.ok) return true;

  if (result.reason === 'conflict') {
    // 画面側が用意していれば、上書き／取り込み／何もしない の 3 択を出す。
    if (hooks.onConflict) return hooks.onConflict(result.message);

    // 画面側が用意されていない状況（本来は起きない）。
    // 訊ねる手段が無いまま上書きすると相手の変更を黙って消すので、何もしない。
    toast(`${result.message} 保存を中止しました。`);
    render();
    return false;
  }

  toast(result.message);
  render();
  return false;
}

/// 競合を承知の上で上書きする
async function forceSave() {
  const forced = await persist({ force: true });
  if (forced.ok) { toast('上書きして保存しました'); return true; }
  toast(forced.message);
  render();
  return false;
}

/// いま保存先に入っているファイルの中身を読む（競合の解決に使う）。
///
/// rebase を付けたときだけ「これが今の下敷き」として更新時刻を覚え直す。
/// 読んだだけで覚え直してはいけない。取り込みを途中で取り消したとき、
/// 相手の変更を見なかったことにして、次の保存で黙って踏み潰すことになる。
async function readVaultFileBytes({ rebase = false } = {}) {
  if (!state.fileHandle) return null;
  const file = await state.fileHandle.getFile();
  if (rebase) state.fileMtime = file.lastModified;
  return new Uint8Array(await file.arrayBuffer());
}

/// 相手の中身を取り込む。呼ぶ前に必ず利用者へ内容を見せて確認を取ること。
async function applyMerge(remotePayload) {
  const merged = A.merge(
    { schemaVersion: V.SCHEMA_VERSION, items: state.items, deletions: state.deletions },
    remotePayload
  );
  state.items = merged.payload.items;
  state.deletions = merged.payload.deletions;
  // 取り込んだ結果を書き戻す。相手の変更は既に手元にあるので上書きしてよい。
  const written = await persist({ force: true });
  if (!written.ok) { toast(written.message); render(); return null; }
  return merged.summary;
}

/// 保管庫を暗号化したままファイルとして書き出す。
///
/// ブラウザにはダウンロードが完了したかを知る手段がない。
/// なので「書き出した」と言い切らず、確かめるよう促す。
/// 失敗しうるところは握りつぶさずに必ず画面へ出す。
async function downloadVault({ forSync = false } = {}) {
  const base = (state.fileName ?? 'vault.pvlt').replace(/\.pvlt$/, '');
  // 控えには日付を入れる。本体と同じ名前にすると、どちらが使っている保管庫で
  // どちらが控えなのか区別できなくなる。
  //
  // 同期用は逆に、保管庫と同じ名前でなければならない。クラウド上の
  // 同じファイルに上書きして戻すのが目的なので、名前が変わると別物になる。
  const name = forSync
    ? `${base}.pvlt`
    : `${base}-backup-${V.isoNoMillis().slice(0, 10)}.pvlt`;

  let url = null;
  try {
    const bytes = await V.seal(payload(), state.key, state.header);
    url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));

    // Safari では body に入っていないと click が効かないことがある
    const link = el('a', { href: url, download: name });
    document.body.append(link);
    link.click();
    link.remove();
  } catch (caught) {
    if (url) URL.revokeObjectURL(url);
    toast(`書き出せませんでした: ${describe(caught)}`);
    render();
    return false;
  }
  // 早く解放しすぎるとダウンロードが途中で壊れる
  setTimeout(() => URL.revokeObjectURL(url), 30_000);

  toast(forSync
    ? `${name} を書き出しました。クラウド上の保管庫に上書きしてください`
    : `${name} を書き出しました。ファイルができているか確かめてください`);
  render();
  return true;
}

// ---- この端末に置いておくもの ----
//
// 2 つの用途で IndexedDB を使う。どちらにも鍵とマスターパスワードは入らない。
//
//   handles: File System Access API のハンドル。「このファイルを触る権利」だけ。
//            次に開くときブラウザが許可を訊き直すので、勝手に読まれることもない。
//   vault:   暗号化した保管庫そのもの。ファイルに書けない環境（iOS の Safari）で使う。
//            取り出せてもマスターパスワードが無ければ中身は読めない。

const DB_NAME = 'passvault';
const DB_VERSION = 2;
const HANDLE_STORE = 'handles';
const VAULT_STORE = 'vault';

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      // 版 1 から上がってくる場合があるので、無いものだけ作る
      const db = request.result;
      if (!db.objectStoreNames.contains(HANDLE_STORE)) db.createObjectStore(HANDLE_STORE);
      if (!db.objectStoreNames.contains(VAULT_STORE)) db.createObjectStore(VAULT_STORE);
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

/// 失敗を投げる版。保管庫本体の読み書きに使う。
async function withStore(storeName, mode, action) {
  const db = await openDB();
  try {
    return await new Promise((resolve, reject) => {
      const transaction = db.transaction(storeName, mode);
      const request = action(transaction.objectStore(storeName));
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
      // 書き込みが確定するのは transaction が終わったとき。
      // request.onsuccess だけを見ていると、容量超過のように
      // あとから起きる中断を取りこぼし、書けたつもりになる。
      transaction.onabort = () => reject(transaction.error ?? new Error('保存が中断されました'));
    });
  } finally {
    db.close();
  }
}

/// 失敗を握りつぶす版。ハンドルは無くても動作に支障がないので静かに諦める。
async function tryStore(storeName, mode, action) {
  try {
    return await withStore(storeName, mode, action);
  } catch {
    return undefined;
  }
}

async function rememberVaultHandle(handle) {
  if (!handle) return;
  await tryStore(HANDLE_STORE, 'readwrite', store => store.put(handle, 'last'));
}

async function recallVaultHandle() {
  return tryStore(HANDLE_STORE, 'readonly', store => store.get('last'));
}

async function forgetVaultHandle() {
  await tryStore(HANDLE_STORE, 'readwrite', store => store.delete('last'));
}

/// 端末の中に保管庫を置く。**失敗は投げる**（呼び出し側が握って画面に出す）。
async function saveLocalVault(bytes, name) {
  await withStore(VAULT_STORE, 'readwrite', store =>
    store.put({ bytes, name, savedAt: V.isoNoMillis() }, 'current'));
}

async function loadLocalVault() {
  return tryStore(VAULT_STORE, 'readonly', store => store.get('current'));
}

async function forgetLocalVault() {
  await withStore(VAULT_STORE, 'readwrite', store => store.delete('current'));
}

/// 保存領域を「消さないでほしい」とブラウザに申し出る。
///
/// iOS はしばらく使わないサイトの保存領域を消すことがある。
/// ホーム画面に追加してあると通りやすい。断られても動作は続くので、
/// 通ったかどうかを返して画面側に判断させる。
async function requestDurableStorage() {
  try {
    if (!navigator.storage?.persist) return null;
    if (await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  } catch {
    return null;
  }
}

function lock() {
  state.key = null;
  state.header = null;
  state.items = [];
  state.deletions = [];
  state.findings = [];
  state.revealed.clear();
  state.selectedId = null;
  state.selection = { kind: 'all' };
  render();
}

/// 保存できていない変更を、暗号化したまま抱えておく。
///
/// 施錠は必ず行う（開けっ放しのほうが危ない）。ただし黙って捨てない。
/// 平文と鍵は捨てるので施錠の意味は保たれ、次に同じパスワードで
/// 解錠できたときだけ中身を取り戻せる。
async function stashUnsaved() {
  if (!state.dirty || !state.key || !state.header) return false;
  try {
    state.stash = {
      bytes: await V.seal(payload(), state.key, state.header),
      header: state.header,
      at: V.isoNoMillis(),
    };
    return true;
  } catch {
    return false;
  }
}

/// 自動施錠。保存できていない変更があれば、まず保存を試み、
/// それでも駄目なら暗号化して抱えてから施錠する。
async function lockForIdle() {
  let stashed = false;
  if (state.dirty) {
    const written = await persist();
    if (!written.ok || state.dirty) stashed = await stashUnsaved();
  }
  lock();
  toast(stashed
    ? '自動的に施錠しました。保存できていない変更は預かってあります'
    : '自動的に施錠しました');
}

/// 解錠したあと、預かっていた変更があれば取り戻せるか調べる。
/// 同じパスワードでなければ開けないので、取り違えは起きない。
async function recoverStash(key) {
  if (!state.stash) return null;
  const { bytes, header, at } = state.stash;
  try {
    const recovered = await V.open(bytes, key, header);
    return { payload: recovered, at };
  } catch {
    // 別の保管庫、あるいはパスワードを変えた後。取り戻せないので捨てる。
    state.stash = null;
    return null;
  }
}

// ============================================================
// 入口の画面
// ============================================================

function renderGate(mode) {
  const gate = $('#gate');
  gate.style.display = 'grid';
  $('#app').classList.remove('on');
  const card = mode === 'create' ? createCard() : unlockCard();
  gate.replaceChildren(card);
  // 前回の保管庫があれば、あとから差し込む（IndexedDB の読みは非同期なので）
  if (!state.pendingBytes) offerRememberedVault(card);
}

async function offerRememberedVault(card) {
  const handle = await recallVaultHandle();
  if (!handle) { await offerLocalVault(card); return; }
  if (state.pendingBytes) return;

  const button = el('button', { className: 'push', textContent: `前回の保管庫を開く（${handle.name}）` });
  button.onclick = async () => {
    button.disabled = true;
    try {
      // 一度閉じたあとは許可が切れているので、その場で訊き直す。
      // 利用者のクリックが起点でないとブラウザが訊いてくれない。
      let permission = await handle.queryPermission({ mode: 'readwrite' });
      if (permission !== 'granted') {
        permission = await handle.requestPermission({ mode: 'readwrite' });
      }
      if (permission !== 'granted') {
        toast('ファイルへのアクセスが許可されませんでした');
        button.disabled = false;
        return;
      }
      const file = await handle.getFile();
      state.fileHandle = handle;
      state.fileName = file.name;
      state.fileMtime = file.lastModified;
      state.pendingBytes = new Uint8Array(await file.arrayBuffer());
      renderGate('unlock');
    } catch (caught) {
      toast(`開けませんでした: ${caught.message ?? caught}`);
      await forgetVaultHandle();
      button.remove();
    }
  };

  offerButton(card, button);
}

/// ファイルに書けない環境（iOS の Safari など）で、この端末に置いた保管庫を出す。
async function offerLocalVault(card) {
  if (state.pendingBytes) return;
  const local = await loadLocalVault();
  if (!local?.bytes) return;

  const when = local.savedAt ? fmtDateTime(local.savedAt) : '時刻不明';
  const button = el('button', { className: 'push',
                                textContent: `この端末の保管庫を開く（${when}）` });
  button.onclick = () => {
    state.fileHandle = null;
    state.fileName = local.name ?? 'vault.pvlt';
    state.fileMtime = null;
    state.localSavedAt = local.savedAt ?? null;
    state.pendingBytes = new Uint8Array(local.bytes);
    renderGate('unlock');
  };
  offerButton(card, button);
}

/// 「新しい保管庫をつくる」より上に差し込む
function offerButton(card, button) {
  card.insertBefore(button, card.querySelector('.tip') ?? null);
  card.insertBefore(el('div', { style: 'height:8px' }), button.nextSibling);
}

function unlockCard() {
  const password = el('input', { className: 'field', type: 'password', placeholder: 'マスターパスワード' });
  const error = el('div', { className: 'error' });
  const button = el('button', { className: 'push primary', textContent: 'ロック解除' });

  const card = el('div', { className: 'gate-card' }, [
    el('div', { className: 'gate-mark' }, [icon('lock', 40)]),
    el('h1', { textContent: 'ロック中' }),
    el('p', { className: 'lead', textContent: state.fileName ?? '保管庫ファイルを選んでください。' }),
    password, error, button,
    el('div', { style: 'height:8px' }),
    el('button', { className: 'push', textContent: '別の保管庫ファイルを開く', onclick: pickVaultFile }),
    el('div', { style: 'height:8px' }),
    el('button', { className: 'push', textContent: '新しい保管庫をつくる', onclick: () => renderGate('create') }),
  ]);

  async function submit() {
    if (!state.pendingBytes) { error.textContent = '保管庫ファイルを選んでください。'; return; }
    if (!password.value) return;
    button.disabled = true;
    button.textContent = '確認中…';
    error.textContent = '';
    try {
      // 施錠中にファイルが外で変わっているかもしれない（クラウド同期など）。
      // 最初に読んだ内容のまま開くと、古い中身を編集することになる。
      if (state.fileHandle) {
        try { state.pendingBytes = await readVaultFileBytes({ rebase: true }) ?? state.pendingBytes; }
        catch { /* 読めなければ手元の内容で試す */ }
      }
      const header = V.decodeHeader(state.pendingBytes);
      const key = await V.deriveKey(password.value, header);
      const opened = await V.open(state.pendingBytes, key, header);
      password.value = '';
      state.key = key;
      state.header = header;
      state.items = opened.items;
      state.deletions = opened.deletions;
      state.findings = A.audit(state.items);

      // 施錠時に保存できていなかった変更があれば、戻すかどうか訊く
      const held = await recoverStash(key);
      if (held) {
        const restore = await hooks.askConfirm?.(
          '保存されていない変更があります',
          `${new Date(held.at).toLocaleString('ja-JP')} に施錠したとき、`
          + 'ファイルに書けていない変更が残っていました。取り戻しますか。',
          { confirmLabel: '取り戻す' });
        state.stash = null;
        if (restore) {
          state.items = held.payload.items;
          state.deletions = held.payload.deletions;
          state.findings = A.audit(state.items);
          state.dirty = true;
          const written = await persist();
          toast(written.ok && !state.dirty
            ? '保存されていない変更を取り戻して保存しました'
            : '取り戻しました。まだファイルに書けていません');
        }
      }
      // 古い形式で保存されていたら、現行形式に書き戻す
      // 古い形式で保存されていたら現行形式に書き戻す。
      // 失敗しても開くのは妨げないが、黙って済ませずに知らせる。
      if (opened.schemaVersion < V.SCHEMA_VERSION) {
        const written = await persist();
        if (!written.ok) toast(`形式の書き戻しに失敗しました: ${written.message}`);
      }
      noteActivity();
      render();
    } catch (caught) {
      error.textContent = caught.message ?? String(caught);
      button.disabled = false;
      button.textContent = 'ロック解除';
      password.value = '';
    }
  }
  button.onclick = submit;
  password.onkeydown = event => { if (event.key === 'Enter') submit(); };
  setTimeout(() => password.focus(), 0);
  return card;
}

function createCard() {
  const first = el('input', { className: 'field', type: 'password', placeholder: 'マスターパスワード' });
  const second = el('input', { className: 'field', type: 'password', placeholder: 'もう一度入力' });
  const hintLength = el('div', { className: 'hint' });
  const hintMatch = el('div', { className: 'hint' });
  const error = el('div', { className: 'error' });
  const button = el('button', { className: 'push primary', textContent: '保管庫を作成', disabled: true });

  function validate() {
    const longEnough = first.value.length >= 12;
    const same = first.value.length > 0 && first.value === second.value;
    const mark = (node, ok, label) => {
      node.className = `hint ${ok ? 'ok' : ''}`;
      // 未達は「×」ではなく空の丸にする。まだ入力していないだけの状態を
      // 間違いとして見せない。
      node.replaceChildren(icon(ok ? 'check' : 'circle', 13), label);
    };
    mark(hintLength, longEnough, '12文字以上');
    mark(hintMatch, same, '2回の入力が一致');
    button.disabled = !(longEnough && same);
  }
  first.oninput = second.oninput = validate;
  validate();

  button.onclick = async () => {
    button.disabled = true;
    button.textContent = '鍵を生成中…';
    error.textContent = '';
    try {
      state.header = V.makeHeader();
      state.key = await V.deriveKey(first.value, state.header);
      state.items = [];
      state.deletions = [];
      state.findings = [];
      first.value = second.value = '';

      if (canUseFilePicker) {
        const handle = await window.showSaveFilePicker({
          suggestedName: 'vault.pvlt',
          types: [{ description: 'PassVault の保管庫', accept: { 'application/octet-stream': ['.pvlt'] } }],
        });
        state.fileHandle = handle;
        state.fileName = handle.name;
        state.fileMtime = (await handle.getFile()).lastModified;
        await rememberVaultHandle(handle);
      } else {
        state.fileName = 'vault.pvlt';
      }
      // 最初の書き込みが失敗したら、作れたつもりにさせてはいけない。
      // 中身は空でも、ここで気づかないと以後の変更が全部宙に浮く。
      const written = await persist();
      if (!written.ok) {
        error.textContent = `保管庫を作成できませんでした。${written.message}`;
        state.key = null;
        state.header = null;
        state.fileHandle = null;
        await forgetVaultHandle();
        button.disabled = false;
        button.textContent = '保管庫を作成';
        validate();
        return;
      }
      noteActivity();
      render();
      if (!state.fileHandle) {
        // 端末の中に置いた。iOS はしばらく使わないと消すことがあるので、
        // 消さないよう申し出たうえで、控えを勧める。
        const durable = await requestDurableStorage();
        toast(durable
          ? 'この端末の中に保存しました。控えの書き出しもときどき行ってください'
          : 'この端末の中に保存しました。ブラウザの都合で消えることがあるので、控えを書き出してください');
      }
    } catch (caught) {
      error.textContent = caught.message ?? String(caught);
      state.key = null;
      button.disabled = false;
      button.textContent = '保管庫を作成';
      validate();
    }
  };

  return el('div', { className: 'gate-card' }, [
    el('div', { className: 'gate-mark' }, [icon('vault', 44)]),
    el('h1', { textContent: '保管庫をつくる' }),
    el('p', { className: 'lead', textContent: 'マスターパスワードだけがこの保管庫を開ける鍵です。どこにも保存されないので、忘れると中身は取り出せません。' }),
    first, second,
    el('div', { className: 'hints' }, [hintLength, hintMatch]),
    error, button,
    el('div', { style: 'height:8px' }),
    el('button', { className: 'push', textContent: '既にある保管庫を開く', onclick: pickVaultFile }),
    el('p', { className: 'tip', textContent: 'ヒント: 覚えやすい単語を4〜5個つないだ長い文（例: 紫の 亀 が 図書館 で 走る）は、記号混じりの短いパスワードより安全で覚えやすいです。' }),
    el('p', { className: 'tip', textContent: '保管庫のファイル（.pvlt）は暗号化されたデータなので、ダブルクリックしても開きません。いつもこの画面から選んで開いてください。' }),
  ]);
}

async function pickVaultFile() {
  try {
    let file;
    if (typeof window.showOpenFilePicker === 'function') {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'PassVault の保管庫', accept: { 'application/octet-stream': ['.pvlt'] } }],
      });
      state.fileHandle = handle;
      await rememberVaultHandle(handle);
      file = await handle.getFile();
    } else {
      file = await pickViaInput();
      state.fileHandle = null;
    }
    state.pendingBytes = new Uint8Array(await file.arrayBuffer());
    state.fileName = file.name;
    state.fileMtime = file.lastModified;
    renderGate('unlock');
  } catch { /* 選択の取り消し */ }
}

function pickViaInput() {
  return new Promise((resolve, reject) => {
    const input = el('input', { type: 'file', accept: '.pvlt,application/octet-stream' });
    input.onchange = () => input.files[0] ? resolve(input.files[0]) : reject();
    input.click();
  });
}

// ============================================================
// 一覧の絞り込み
// ============================================================

const activeItems = () => state.items.filter(item => !item.trashedAt);
const trashedItems = () => state.items.filter(item => item.trashedAt);

function allTags() {
  return [...new Set(activeItems().flatMap(item => item.tags))]
    .filter(Boolean).sort((a, b) => a.localeCompare(b, 'ja'));
}

function itemsFor(selection) {
  switch (selection.kind) {
    case 'all': return activeItems();
    case 'favorites': return activeItems().filter(item => item.isFavorite);
    case 'category': return activeItems().filter(item => item.category === selection.value);
    case 'tag': return activeItems().filter(item => item.tags.includes(selection.value));
    case 'watchtower': {
      const flagged = new Set(state.findings.map(finding => finding.itemId));
      return activeItems().filter(item => flagged.has(item.id));
    }
    case 'trash': return trashedItems();
    default: return activeItems();
  }
}

function visibleItems() {
  return itemsFor(state.selection)
    .filter(item => V.matches(item, state.search))
    .sort((a, b) => V.displayTitle(a).localeCompare(V.displayTitle(b), 'ja'));
}

const selectionTitle = selection => ({
  all: 'すべて', favorites: 'お気に入り', watchtower: '点検', trash: 'ゴミ箱',
  category: V.CATEGORIES[selection.value]?.name, tag: selection.value,
}[selection.kind] ?? 'すべて');

const sameSelection = (a, b) => a.kind === b.kind && a.value === b.value;

// ============================================================
// 描画
// ============================================================

let lastShownItemId = null;

function render() {
  // 別の項目に移ったら、表示にしていた欄を伏せ字に戻す。
  // 解除したままだと、画面を人に見せたときに前の項目の中身まで出てしまう。
  if (state.selectedId !== lastShownItemId) {
    state.revealed.clear();
    lastShownItemId = state.selectedId;
  }

  if (!state.key) {
    renderGate(state.pendingBytes ? 'unlock' : 'create');
    return;
  }
  $('#gate').style.display = 'none';
  $('#app').classList.add('on');

  // 詳細を出している最中に項目が消えた（削除・取り込みなど）ら一覧へ戻す。
  // 戻さないと、何も無い画面に取り残される。
  if (state.view === 'detail' && !state.items.some(item => item.id === state.selectedId)) {
    state.view = 'list';
  }

  renderBar();
  if (state.view === 'detail') renderDetail();
  else renderListView();
}

/// 上の帯。検索がこのアプリの主役なので、いちばん広い場所を与える。
function renderBar() {
  const bar = $('#bar');

  const tools = (...extra) => el('div', { className: 'bar-tools' }, [
    ...extra,
    el('button', { className: 'iconbtn', title: 'パスワード生成',
                   'aria-label': 'パスワード生成', onclick: openGenerator }, [icon('wand')]),
    el('button', { className: 'iconbtn', title: '設定',
                   'aria-label': '設定', onclick: openSettings }, [icon('gear')]),
    el('button', { className: 'iconbtn', title: 'ロック',
                   'aria-label': 'ロック', onclick: lock }, [icon('lock')]),
  ]);

  if (state.view === 'detail') {
    const item = state.items.find(candidate => candidate.id === state.selectedId);
    bar.replaceChildren(
      el('button', { className: 'backbtn', title: '一覧へ戻る（Esc）',
                     'aria-label': '一覧へ戻る', onclick: showList },
         [icon('back', 18), el('span', { textContent: selectionTitle(state.selection) })]),
      // 帯にも名前を出す。下へ辿ったときに何を見ているか分からなくならないように。
      el('div', { className: 'bar-title', textContent: item ? V.displayTitle(item) : '' }),
      tools(),
    );
    return;
  }

  const search = el('input', {
    id: 'search', type: 'search', placeholder: '検索', value: state.search,
    autocomplete: 'off', spellcheck: false,
    oninput: event => {
      state.search = event.target.value;
      state.cursor = -1;
      noteActivity();
      renderListView();
    },
  });

  bar.replaceChildren(
    el('div', { className: 'brand', title: state.dirty ? '保存できていない変更があります' : '' }, [
      icon('vault', 18),
      el('span', { textContent: 'PassVault' }),
      state.dirty ? el('span', { className: 'unsaved', textContent: '未保存' }) : null,
    ]),
    el('div', { className: 'searchwrap' }, [search]),
    tools(el('button', { className: 'iconbtn', title: '新しい項目',
                         'aria-label': '新しい項目', onclick: openNewItemMenu }, [icon('plus')])),
  );
}

/// 絞り込みの札。縦のサイドバーをやめて横一列にした。
/// 中身のある区分しか出さない。空の器が並んでも選ぶ理由がない。
function renderChips() {
  const chips = [];
  const add = (selection, label, extra) => {
    const selected = sameSelection(selection, state.selection);
    chips.push(el('button', {
      className: `chip${selected ? ' sel' : ''}`,
      onclick: () => {
        state.selection = selection;
        state.cursor = -1;
        noteActivity();
        renderListView();
      },
    }, [label, extra ?? null]));
  };

  // 出すのは「検索では言い表せない見方」だけにする。
  // 種別もタグも検索語で絞れるので、札にすると器が並ぶだけになる。
  // （実際、種別とタグを全部出したら 16 個並んで、縦のサイドバーの
  //   散らかりを横に移しただけになった）
  const n = (value, cls) => el('span', { className: cls ? `n ${cls}` : 'n', textContent: String(value) });

  add({ kind: 'all' }, 'すべて', n(activeItems().length));
  const favorites = itemsFor({ kind: 'favorites' }).length;
  if (favorites) add({ kind: 'favorites' }, 'お気に入り', n(favorites));
  if (state.findings.length) add({ kind: 'watchtower' }, '点検', n(state.findings.length, 'warn'));
  if (trashedItems().length) add({ kind: 'trash' }, 'ゴミ箱', n(trashedItems().length));

  // 種別やタグから入ってきた場合は、いま何で絞っているかを見せて戻せるようにする
  if (state.selection.kind === 'category' || state.selection.kind === 'tag') {
    add(state.selection, selectionTitle(state.selection), n(itemsFor(state.selection).length));
  }

  return el('div', { className: 'chips' }, chips);
}

function renderListView() {
  const items = visibleItems();
  const isTrash = state.selection.kind === 'trash';

  // 選んでいた区分が空になったら「すべて」へ落とす（最後の 1 件を消したときなど）
  if (!sameSelection(state.selection, { kind: 'all' }) && !items.length && !state.search) {
    const stillThere = itemsFor(state.selection).length;
    if (!stillThere) state.selection = { kind: 'all' };
  }

  // -1（まだキーボードを触っていない）はそのまま残す。
  // ここで 0 に丸めると、開いた直後から 1 行目が光って選択済みに見える。
  if (state.cursor >= 0) state.cursor = Math.min(state.cursor, items.length - 1);

  const parts = [renderChips()];

  if (isTrash && trashedItems().length) {
    parts.push(el('div', { className: 'listtools' }, [
      el('button', { className: 'linkbtn', onclick: emptyTrash }, [icon('broom', 14), 'ゴミ箱を空にする']),
    ]));
  }

  if (items.length) {
    parts.push(el('div', { className: 'list' }, items.map((item, index) => itemRow(item, index))));
    parts.push(el('div', { className: 'listfoot', textContent: `${items.length} 件` }));
  } else {
    parts.push(el('div', { className: 'empty' }, [
      el('span', { className: 'big' }, [icon(isTrash ? 'trash' : (state.search ? 'search' : 'inbox'), 38)]),
      el('span', { className: 'lead', textContent:
        isTrash ? 'ゴミ箱は空です'
                : (state.search ? `「${state.search}」に一致するものはありません` : 'まだ何もありません') }),
      state.search || isTrash ? null
        : el('span', { textContent: '右上の ＋ から追加できます。' }),
    ]));
  }

  $('#main').replaceChildren(el('div', { className: 'sheet' }, parts));
}

async function emptyTrash() {
  const ok = await hooks.askConfirm?.('ゴミ箱を空にする',
    'ゴミ箱の中身を完全に削除します。取り消せません。',
    { confirmLabel: '完全に削除', destructive: true });
  if (!ok) return;
  const removed = trashedItems();
  state.items = state.items.filter(item => !item.trashedAt);
  state.deletions.push(...removed.map(item => ({ id: item.id, deletedAt: V.isoNoMillis() })));
  if (!await save()) return;
  toast('ゴミ箱を空にしました');
  render();

let lockingForIdle = false;
setInterval(async () => {
  if (!state.key || state.holds > 0 || lockingForIdle) return;
  const minutes = settings.autoLockMinutes;
  if (minutes > 0 && Date.now() - state.lastActivity >= minutes * 60_000) {
    lockingForIdle = true;
    try { await lockForIdle(); } finally { lockingForIdle = false; }
  }
}, 5000);

// 別の端末の変更を見に行く。ファイルの更新時刻を見るだけなので軽い。
setInterval(() => { pollRemoteChange(); }, 15_000);

document.addEventListener('visibilitychange', () => {
  // 画面に戻ってきたときは、待たずに一度見る。
  // 別の端末を触ってから戻ってくる、というのが実際いちばん多い。
  if (!document.hidden) { pollRemoteChange(); return; }

  // 離れたら施錠する。ダイアログを開いている最中は、
  // 取り込みの file 選択などで一時的に隠れることがあるので触らない。
  if (settings.lockWhenAway && state.key && state.holds === 0) lockForIdle();
});

// ============================================================
// キーボード
// ============================================================
//
// 検索から手を離さずに目的の項目へ行けること。
// この造りだと、探す→選ぶ→コピーが一続きの操作になる。

document.addEventListener('keydown', event => {
  if (!state.key || state.holds > 0) return;   // 施錠中とダイアログ表示中は触らない

  const search = $('#search');
  const typing = document.activeElement?.tagName === 'INPUT'
              || document.activeElement?.tagName === 'TEXTAREA';

  if (event.key === 'Escape') {
    if (state.view === 'detail') { showList(); event.preventDefault(); return; }
    if (state.search) {
      state.search = '';
      state.cursor = -1;
      renderListView();
      search?.focus();
      event.preventDefault();
    }
    return;
  }

  if (state.view !== 'list') return;

  const items = visibleItems();

  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    if (!items.length) return;
    const step = event.key === 'ArrowDown' ? 1 : -1;
    state.cursor = Math.max(0, Math.min(items.length - 1, state.cursor + step));
    renderListView();
    $('.item-row.cur')?.scrollIntoView({ block: 'nearest' });
    event.preventDefault();
    return;
  }

  if (event.key === 'Enter' && items[state.cursor]) {
    // 検索欄で入力中でも開ける。矢印で選んでそのまま Enter が自然な流れ。
    openItem(items[state.cursor].id);
    event.preventDefault();
    return;
  }

  // 選んでいる項目を、開かずに写す。⌘C がパスワード、⌘⇧C がユーザー名。
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'c' && items[state.cursor]) {
    if (!window.getSelection()?.toString()) {
      const item = items[state.cursor];
      if (event.shiftKey) {
        const username = V.primaryUsername(item);
        if (username) { copyPlain(username, 'ユーザー名'); event.preventDefault(); }
      } else {
        const password = V.primaryPassword(item);
        if (password) { copySecret(password, 'パスワード'); event.preventDefault(); }
      }
    }
    return;
  }

  // 文字を打ったら検索へ吸い込む。どこを触っていても探し始められる。
  if (!typing && event.key.length === 1 && !event.metaKey && !event.ctrlKey && !event.altKey) {
    search?.focus();
  }
});

for (const event of ['click', 'keydown', 'pointermove']) {
  document.addEventListener(event, noteActivity, { passive: true });
}

window.addEventListener('beforeunload', event => {
  if (state.dirty) { event.preventDefault(); event.returnValue = ''; }
});

const STRENGTH_COLORS = ['var(--danger)', 'var(--danger)', 'var(--warn)', 'var(--ok)', 'var(--accent)'];

function strengthRow(password) {
  const bits = X.estimateBits(password);
  const level = X.strengthLevel(bits);
  const color = STRENGTH_COLORS[level.rank];
  return el('div', { className: 'strength' }, [
    el('span', { className: 'bar' }, [
      el('i', { style: `width:${Math.min(bits / 128, 1) * 100}%;background:${color}` }),
    ]),
    el('span', { className: 'lv', style: `color:${color}`, textContent: `${level.label}（推定 ${Math.floor(bits)} ビット）` }),
  ]);
}

hooks.renderDetail = function renderDetail() {

    className: `iconbtn${item.isFavorite ? ' on' : ''}`,

  parts.push(el('div', { className: 'detail-head' }, [

    el('div', { className: 'grow' }, [

      el('button', {
        className: 'cat', title: `${V.CATEGORIES[item.category].name}だけを見る`,
        onclick: () => filterBy({ kind: 'category', value: item.category }),
        textContent: V.CATEGORIES[item.category].name,
      }),
    ]),
    favButton,
  ]));

  if (item.trashedAt) {
    parts.push(el('div', { className: 'banner quiet' }, [

  }

  if (item.oneTimePasswordSecret) {

    mountOTP(otpCard, item.oneTimePasswordSecret);
  }

  if (item.tags.length) {
    // 押したらそのタグで絞る。札から種別とタグを外したぶん、

    parts.push(el('div', { className: 'tags' },

        className: 'tag', title: `「${tag}」で絞り込む`,
        onclick: () => filterBy({ kind: 'tag', value: tag }),
      }, [icon('tag', 12), tag]))));

  if (item.notes) {
    parts.push(el('div', { className: 'lab', style: 'font-size:12px;color:var(--text-2);margin-bottom:4px', textContent: 'メモ' }));

  if (item.passwordHistory.length) {

      el('div', { className: 'row' }, [

          el('div', { className: 'val mono', textContent: change.value }),
          el('div', { className: 'lab', textContent: `${fmtDateTime(change.changedAt)} まで使用` }),
        ]),

      el('summary', { textContent: `以前のパスワード（${item.passwordHistory.length}件）` }),
      list,
    ]));

  parts.push(el('div', { className: 'meta', textContent:

  const actions = el('div', { className: 'actions' });

        if (!await save()) return;
        toast('元に戻しました'); render();
      } }),

        const ok = await hooks.askConfirm('完全に削除',

        state.items = state.items.filter(candidate => candidate.id !== item.id);
        state.deletions.push({ id: item.id, deletedAt: V.isoNoMillis() });

  } else {

        toast('ゴミ箱に入れました'); render();
      } }),

  }
  parts.push(actions);

  column.replaceChildren(el('div', { className: 'sheet detail' }, parts));

function fieldRow(field) {
  const concealed = V.isConcealed(field.kind);
  const revealed = state.revealed.has(field.id);
  const shown = concealed && !revealed
    ? '•'.repeat(Math.min(Math.max(field.value.length, 8), 24))
    : (field.kind === 'cardNumber' ? V.groupedCardNumber(field.value) : field.value);

  const value = field.kind === 'url'
    ? el('a', { className: 'val', href: normalizeURL(field.value), target: '_blank', rel: 'noreferrer noopener', textContent: field.value })
    : el('div', { className: `val${concealed ? ' mono' : ''}`, textContent: shown });

  const body = el('div', { className: 'grow' }, [
    el('div', { className: 'lab', textContent: field.label }),
    value,
    field.kind === 'password' && field.value ? strengthRow(field.value) : null,
  ]);

  const row = el('div', { className: 'row' }, [body]);
  if (concealed) {
    row.append(el('button', {
      className: 'iconbtn', title: revealed ? '隠す' : '表示',
      'aria-label': revealed ? `${field.label}を隠す` : `${field.label}を表示`,
      onclick: () => {
        revealed ? state.revealed.delete(field.id) : state.revealed.add(field.id);
        hooks.renderDetail();
      },
    }, [icon(revealed ? 'eyeOff' : 'eye')]));
  }
  row.append(el('button', {
    className: 'iconbtn', title: 'コピー', 'aria-label': `${field.label}をコピー`,
    onclick: () => concealed ? copySecret(field.value, field.label) : copyPlain(field.value, field.label),
  }, [icon('copy')]));
  return row;
}

function normalizeURL(value) {
  return value.includes('://') ? value : `https://${value}`;
}

/// ワンタイムパスワード。1 秒ごとに残り時間の輪が縮んでいく。
function mountOTP(container, secret) {
  const config = X.parseOTP(secret);
  if (!config) {
    container.replaceChildren(el('div', { className: 'row' }, [
      icon('warning'),
      el('div', { className: 'grow', textContent: 'ワンタイムパスワードの設定を読み取れませんでした' }),
    ]));
    return;
  }

  const code = el('div', { className: 'code', textContent: '••• •••' });
  const ring = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  ring.setAttribute('viewBox', '0 0 32 32');
  ring.setAttribute('class', 'ring');
  ring.innerHTML =
    '<circle cx="16" cy="16" r="14" fill="none" stroke="var(--hairline)" stroke-width="3"/>' +
    '<circle id="arc" cx="16" cy="16" r="14" fill="none" stroke="var(--accent)" stroke-width="3"' +
    ' stroke-linecap="round" transform="rotate(-90 16 16)"/>' +
    '<text x="16" y="20" text-anchor="middle">0</text>';

  container.replaceChildren(el('div', { className: 'otp' }, [
    el('div', { className: 'grow' }, [
      el('div', { className: 'lab', textContent: 'ワンタイムパスワード' }),
      code,
    ]),
    ring,
    el('button', {
      className: 'iconbtn', title: 'コピー', 'aria-label': 'ワンタイムパスワードをコピー',
      onclick: async () => copySecret(await X.otpCode(config), 'ワンタイムパスワード'),
    }, [icon('copy')]),
  ]));

  const circumference = 2 * Math.PI * 14;
  async function tick() {
    const remaining = X.otpSecondsRemaining(config);
    code.textContent = X.formatOTP(await X.otpCode(config));
    code.style.color = remaining <= 5 ? 'var(--warn)' : '';
    const arc = ring.querySelector('#arc');
    arc.setAttribute('stroke-dasharray', String(circumference));
    arc.setAttribute('stroke-dashoffset', String(circumference * (1 - remaining / config.period)));
    arc.setAttribute('stroke', remaining <= 5 ? 'var(--warn)' : 'var(--accent)');
    ring.querySelector('text').textContent = String(remaining);
  }
  tick();
  otpTimer = setInterval(tick, 1000);
}

function openEditor(original, isNew = false) {
  const draft = structuredClone(original);
  const category = V.CATEGORIES[draft.category];
  let tagText = draft.tags.join(', ');

  const dialog = makeDialog(isNew ? `新規${category.name}` : '編集', async () => {
    const title = draft.title.trim();
    if (!title) { toast('タイトルを入力してください'); return false; }
    draft.tags = tagText.split(',').map(tag => tag.trim()).filter(Boolean);
    draft.oneTimePasswordSecret = draft.oneTimePasswordSecret.trim();
    draft.updatedAt = V.isoNoMillis();

    const index = state.items.findIndex(item => item.id === draft.id);
    if (index >= 0) {
      // パスワードが変わったら、古いものを履歴に残す
      const previous = V.primaryPassword(state.items[index]);
      if (previous && previous !== V.primaryPassword(draft)) {
        draft.passwordHistory = [{ id: crypto.randomUUID(), value: previous, changedAt: V.isoNoMillis() },
                                 ...draft.passwordHistory].slice(0, 20);
      }
      state.items[index] = draft;
    } else {
      state.items.push(draft);
    }
    state.selectedId = draft.id;
    if (!await save()) return false;   // 失敗したらダイアログを閉じない
    toast('保存しました');
    render();
    return true;
  });

  const body = dialog.querySelector('.dlg-body');

  const titleInput = el('input', { className: 'field', value: draft.title, placeholder: category.placeholder,
    oninput: event => { draft.title = event.target.value; } });
  body.append(el('div', { className: 'group' }, [
    el('div', { className: 'g-row' }, [el('span', { className: 'g-lab', textContent: 'タイトル' }), titleInput]),
    el('div', { className: 'g-row between' }, [
      el('span', { textContent: '種別' }),
      el('span', { className: 'inline', style: 'color:var(--text-2)' },
        [icon(CATEGORY_LOOK[draft.category].icon, 15), category.name]),
    ]),
  ]));

  const fieldsGroup = el('div', { className: 'group' });
  const renderFields = () => {
    fieldsGroup.replaceChildren(...draft.fields.map((field, index) => editorField(draft, field, index, renderFields)));
  };
  renderFields();
  if (draft.fields.length) {
    body.append(el('div', { className: 'g-title', textContent: '項目' }), fieldsGroup);
  } else {
    body.append(fieldsGroup);
  }

  body.append(el('div', { className: 'group' }, [
    el('button', { className: 'g-row', style: 'color:var(--accent)',
      textContent: '＋ 欄を追加',
      onclick: async () => {
        const label = await hooks.askText('欄を追加', '欄の名前',
          { placeholder: '例: 復旧コード' });
        if (!label) return;
        draft.fields.push({ id: crypto.randomUUID(), label, value: '', kind: 'text', isCustom: true });
        renderFields();
      } }),
  ]));

  if (category.otp) {
    const preview = el('div', { className: 'lab', style: 'display:flex;align-items:center;gap:5px' });
    const otpInput = el('input', {
      className: 'field', value: draft.oneTimePasswordSecret,
      placeholder: 'otpauth://totp/... または Base32 のシークレット',
      style: 'font-family:ui-monospace,monospace',
      oninput: async event => { draft.oneTimePasswordSecret = event.target.value; await updatePreview(); },
    });
    async function updatePreview() {
      const config = X.parseOTP(draft.oneTimePasswordSecret);
      if (!draft.oneTimePasswordSecret.trim()) { preview.replaceChildren(); return; }
      if (!config) {
        preview.style.color = 'var(--warn)';
        preview.replaceChildren(icon('warning', 13), 'この文字列からはコードを作れません');
        return;
      }
      preview.style.color = 'var(--ok)';
      preview.replaceChildren(icon('check', 13),
        `${X.formatOTP(await X.otpCode(config))}（残り ${X.otpSecondsRemaining(config)} 秒）`);
    }
    updatePreview();
    body.append(
      el('div', { className: 'g-title', textContent: 'ワンタイムパスワード' }),
      el('div', { className: 'group' }, [el('div', { className: 'g-row' }, [otpInput, preview])]),
      el('div', { className: 'g-foot', textContent: '認証アプリの登録画面に出る「手動入力用のキー」か、QRコードの中身（otpauth://…）をそのまま貼り付けてください。' }),
    );
  }

  const tagInput = el('input', { className: 'field', value: tagText, placeholder: 'カンマ区切り（例: 仕事, 経理）',
    oninput: event => { tagText = event.target.value; } });
  const existing = [...new Set(activeItems().flatMap(item => item.tags))].filter(Boolean).sort();
  const suggestions = el('div', { style: 'display:flex;flex-wrap:wrap;gap:6px;margin-top:8px' },
    existing.map(tag => el('button', { className: 'pill', textContent: tag, onclick: () => {

function editorField(draft, field, index, refresh) {
  const concealed = V.isConcealed(field.kind);
  const key = `edit-${field.id}`;
  const revealed = state.revealed.has(key);

  const input = field.kind === 'multiline'
    ? el('textarea', { className: 'field', rows: 3, value: field.value })
    : el('input', { className: 'field', type: concealed && !revealed ? 'password' : 'text', value: field.value });
  input.oninput = event => { field.value = event.target.value; if (field.kind === 'password') refreshStrength(); };
  if (concealed) input.style.fontFamily = 'ui-monospace, monospace';

  const strength = el('div');
  const refreshStrength = () => {
    strength.replaceChildren(field.value ? strengthRow(field.value) : el('span'));
  };
  refreshStrength();

  const controls = el('div', { className: 'inline' }, [el('span', { className: 'grow' }, [input])]);
  if (concealed) {
    controls.append(el('button', { className: 'iconbtn',
      title: revealed ? '隠す' : '表示', 'aria-label': revealed ? '隠す' : '表示',
      onclick: () => { revealed ? state.revealed.delete(key) : state.revealed.add(key); refresh(); } },
      [icon(revealed ? 'eyeOff' : 'eye')]));
  }
  if (field.kind === 'password') {
    controls.append(el('button', { className: 'iconbtn', title: 'パスワードを生成',
      'aria-label': 'パスワードを生成',
      onclick: () => hooks.openGenerator(generated => {
        field.value = generated;
        input.value = generated;
        state.revealed.add(key);
        refresh();
      }) }, [icon('wand')]));
  }

  const header = el('div', { className: 'inline' }, [
    el('span', { className: 'g-lab grow', textContent: field.label }),
    field.isCustom ? el('button', { className: 'iconbtn', title: 'この欄を削除',
      'aria-label': 'この欄を削除',
      onclick: () => { draft.fields.splice(index, 1); refresh(); } }, [icon('close', 14)]) : null,
  ]);

  return el('div', { className: 'g-row' }, [header, controls, field.kind === 'password' ? strength : null]);
}

function openPasswordChange() {
  const current = el('input', { className: 'field', type: 'password', placeholder: '現在のマスターパスワード' });
  const next = el('input', { className: 'field', type: 'password', placeholder: '新しいマスターパスワード（12文字以上）' });
  const confirmField = el('input', { className: 'field', type: 'password', placeholder: 'もう一度入力' });
  const error = el('div', { className: 'error' });

  const dialog = makeDialog('マスターパスワードを変更', async () => {
    error.textContent = '';
    if (next.value.length < 12) { error.textContent = '新しいパスワードは12文字以上にしてください。'; return false; }
    if (next.value !== confirmField.value) { error.textContent = '新しいパスワードの入力が一致していません。'; return false; }
    try {
      // 現在のパスワードが本当に合っているかを、いまの鍵で作った暗号文で確かめる
      const probe = await V.seal(payloadSnapshot(), state.key, state.header);
      const currentKey = await V.deriveKey(current.value, state.header);
      await V.open(probe, currentKey, state.header);
    } catch {
      error.textContent = '現在のマスターパスワードが違います。';
      return false;
    }
    // 鍵を差し替える前に、書き込めることを確かめる。
    // 書けないまま鍵だけ変えると、画面の鍵とファイルの鍵が食い違う。
    const previousHeader = state.header;
    const previousKey = state.key;
    state.header = V.makeHeader();
    state.key = await V.deriveKey(next.value, state.header);
    if (!await save()) {
      state.header = previousHeader;
      state.key = previousKey;
      error.textContent = 'ファイルに書けなかったため、変更を取り消しました。';
      return false;
    }
    toast('マスターパスワードを変更しました');
    return true;
  }, '変更');

  dialog.querySelector('.dlg-body').append(
    el('div', { className: 'group' }, [
      el('div', { className: 'g-row' }, [current]),
      el('div', { className: 'g-row' }, [next]),
      el('div', { className: 'g-row' }, [confirmField]),
    ]),
    error,
    el('div', { className: 'g-foot', textContent: '変更すると保管庫全体を新しい鍵で書き直します。古いパスワードでは開けなくなります。' }),
  );
  dialog.showModal();
}

const payloadSnapshot = () =>
  ({ schemaVersion: V.SCHEMA_VERSION, items: state.items, deletions: state.deletions });

// ============================================================
// 取り込み（マージ）
// ============================================================
//
// 失った同期の代わり。2 つの保管庫ファイルを突き合わせて、
// 項目ごとに更新時刻の新しい方を残す。どちら側から取り込んでも同じ結果になる。

/// 相手のファイルを開く。まず手元の鍵を試し、駄目ならパスワードを訊く。
/// 別の端末でマスターパスワードを変えていた場合は鍵が違うため。
async function decryptForeignVault(bytes) {
  const header = V.decodeHeader(bytes);

  const sameHeader = state.header
    && header.raw.length === state.header.raw.length
    && header.raw.every((byte, index) => byte === state.header.raw[index]);
  if (sameHeader) {
    try { return await V.open(bytes, state.key, header); } catch { /* 訊きに回る */ }
  }

  const password = await askPassword();
  if (password === null) return null;
  const key = await V.deriveKey(password, header);
  return V.open(bytes, key, header);  // 違えば例外が出る
}

function askPassword() {
  return new Promise(resolve => {
    const input = el('input', { className: 'field', type: 'password',
      placeholder: 'そのファイルのマスターパスワード' });
    let answered = false;
    const dialog = makeDialog('パスワードを入力', () => {
      if (!input.value) return false;
      answered = true;
      resolve(input.value);
      return true;
    }, '開く');
    dialog.onDismiss = () => { if (!answered) resolve(null); };
    dialog.querySelector('.dlg-body').append(
      el('div', { className: 'group' }, [el('div', { className: 'g-row' }, [input])]),
      el('div', { className: 'g-foot', textContent:
        'いま開いている保管庫とは別のパスワードで作られている場合に必要です。' }),
    );
    dialog.showModal();
    setTimeout(() => input.focus(), 0);
  });
}

/// 取り込む前に、何が起きるかを見せて確かめてもらう
function confirmMerge(remotePayload, sourceLabel) {
  return new Promise(resolve => {
    const preview = A.merge(
      { schemaVersion: V.SCHEMA_VERSION, items: state.items, deletions: state.deletions },
      remotePayload
    );
    const localIds = new Set(state.items.map(item => item.id));
    const added = preview.payload.items.filter(item => !localIds.has(item.id));
    const updated = preview.payload.items.filter(item => {
      const mine = state.items.find(candidate => candidate.id === item.id);
      return mine && JSON.stringify(mine) !== JSON.stringify(item);
    });

    let answered = false;
    const dialog = makeDialog('取り込みの確認', () => {
      answered = true;
      resolve(true);
      return true;
    }, '取り込む');
    dialog.onDismiss = () => { if (!answered) resolve(false); };

    const body = dialog.querySelector('.dlg-body');
    body.append(
      el('div', { className: 'g-foot', style: 'margin-top:0', textContent: `取り込み元: ${sourceLabel}` }),
      el('div', { className: 'group' }, [
        el('div', { className: 'g-row between' }, [
          el('span', { textContent: '結果' }),
          el('span', { style: 'color:var(--text-2)', textContent: A.summaryText(preview.summary) }),
        ]),
        el('div', { className: 'g-row between' }, [
          el('span', { textContent: '取り込み後の件数' }),
          el('span', { style: 'color:var(--text-2)',
                       textContent: `${preview.payload.items.filter(i => !i.trashedAt).length} 件` }),
        ]),
      ]),
    );

    const listGroup = (title, items) => {
      if (!items.length) return;
      body.append(
        el('div', { className: 'g-title', textContent: `${title}（${items.length}）` }),
        el('div', { className: 'group' }, items.slice(0, 12).map(item =>
          el('div', { className: 'g-row' }, [
            icon(CATEGORY_LOOK[item.category].icon, 14),
            el('span', { style: 'margin-left:7px', textContent: V.displayTitle(item) }),
          ]))),
      );
      if (items.length > 12) {
        body.append(el('div', { className: 'g-foot', textContent: `ほか ${items.length - 12} 件` }));
      }
    };
    listGroup('追加される項目', added);
    listGroup('上書きされる項目', updated);

    if (preview.summary.deleted) {
      body.append(el('div', { className: 'g-foot', style: 'color:var(--warn)', textContent:
        `相手側で完全に削除された ${preview.summary.deleted} 件は、こちらからも消えます。` }));
    }
    if (!added.length && !updated.length && !preview.summary.deleted) {
      body.append(el('div', { className: 'g-foot', textContent: '変わるものはありません。' }));
    }

    dialog.showModal();
  });
}

/// file を 1 つ選ばせる。取り消されたら null。
///
/// 選んでいる間は自動施錠を止める。環境によっては file 選択の窓が出た時点で
/// こちらが「隠れた」扱いになり、離席施錠が誤爆して、
/// 選び終えたときには施錠済み、ということが起こりうる。
async function pickFile(accept, description) {
  state.holds += 1;
  try {
    if (typeof window.showOpenFilePicker === 'function') {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description, accept: { 'application/octet-stream': accept.split(',') } }],
      });
      return await handle.getFile();
    }
    return await new Promise((resolve, reject) => {
      const input = el('input', { type: 'file', accept });
      input.onchange = () => (input.files[0] ? resolve(input.files[0]) : reject());
      input.click();
    });
  } catch {
    return null;
  } finally {
    state.holds = Math.max(0, state.holds - 1);
    noteActivity();
  }
}

/// 相手のファイルを選んで取り込む
async function importFromFile() {
  const file = await pickFile('.pvlt', 'PassVault の保管庫');
  if (!file) return;
  await importBytes(new Uint8Array(await file.arrayBuffer()), file.name);
}

/// 他のアプリが書き出した CSV を取り込む。
///
/// Chrome / Safari / Bitwarden / 1Password / KeePassXC の書き出しを確認済み。
/// 列は見出しの名前で当てる。位置で決め打つと、書き出し元が変わった途端に
/// パスワードとユーザー名が入れ替わったまま気づけない。
async function importFromCSV() {
  const file = await pickFile('.csv,.txt', 'CSV');
  if (!file) return;

  let parsed;
  try {
    parsed = C.toRecords(C.parseCSV(await file.text()));
  } catch (caught) {
    toast(`読めませんでした: ${caught.message ?? caught}`);
    return;
  }
  if (!parsed) {
    toast('見出し行を読み取れませんでした。パスワードの列がある CSV を選んでください');
    return;
  }
  if (!parsed.records.length) {
    toast('中身のある行がありませんでした');
    return;
  }

  // 既にあるものは飛ばす。飛ばさないと、2 回取り込んだだけで全部が倍になる。
  const known = new Set(state.items.map(item =>
    C.identity(V.displayTitle(item), V.primaryUsername(item) ?? '')));
  const fresh = parsed.records.filter(record => !known.has(C.identity(record.title, record.username)));
  const skipped = parsed.records.length - fresh.length;

  if (!await confirmCSV(file.name, parsed, fresh, skipped)) {
    toast('取り込みを中止しました');
    return;
  }
  if (!fresh.length) return;

  for (const record of fresh) {
    const item = V.makeItem('login');
    item.title = record.title;
    item.fields[0].value = record.username;
    item.fields[1].value = record.password;
    item.fields[2].value = record.url;
    item.notes = record.notes;
    item.tags = record.tags;
    item.isFavorite = record.favorite;
    if (record.totp && X.parseOTP(record.totp)) item.oneTimePasswordSecret = record.totp;
    state.items.push(item);
  }
  if (!await save()) return;
  toast(`${fresh.length} 件を取り込みました`);
  render();
}

/// 取り込む前に中身を見せる。パスワードは出さない。
function confirmCSV(sourceName, parsed, fresh, skipped) {
  return new Promise(resolve => {
    let answered = false;
    const dialog = makeDialog('CSV の取り込み', () => { answered = true; resolve(true); return true; },
                              fresh.length ? '取り込む' : '閉じる');
    dialog.onDismiss = () => { if (!answered) resolve(false); };

    const found = Object.keys(parsed.mapping);
    const body = dialog.querySelector('.dlg-body');
    body.append(
      el('div', { className: 'g-foot', style: 'margin-top:0', textContent: `取り込み元: ${sourceName}` }),
      el('div', { className: 'group' }, [
        el('div', { className: 'g-row between' }, [
          el('span', { textContent: '読めた行' }),
          el('span', { style: 'color:var(--text-2)', textContent: `${parsed.records.length} 件` }),
        ]),
        el('div', { className: 'g-row between' }, [
          el('span', { textContent: '新しく入るもの' }),
          el('span', { style: 'color:var(--accent)', textContent: `${fresh.length} 件` }),
        ]),
        skipped ? el('div', { className: 'g-row between' }, [
          el('span', { textContent: '既にあるので飛ばすもの' }),
          el('span', { style: 'color:var(--text-2)', textContent: `${skipped} 件` }),
        ]) : null,
        el('div', { className: 'g-row between' }, [
          el('span', { textContent: '当てられた列' }),
          el('span', { style: 'color:var(--text-2)', textContent: found.join('、') }),
        ]),
      ]),
    );

    if (parsed.mapping.password === undefined) {
      body.append(el('div', { className: 'banner', style: 'margin-bottom:14px' }, [
        icon('warning'),
        el('div', {}, [
          el('div', { className: 'bt', textContent: 'パスワードの列が見つかりません' }),
          el('div', { className: 'bd', textContent: 'このまま取り込むと、パスワードは空のまま入ります。' }),
        ]),
      ]));
    }

    if (fresh.length) {
      body.append(
        el('div', { className: 'g-title', textContent: `入るもの（${fresh.length}）` }),
        el('div', { className: 'group' }, fresh.slice(0, 12).map(record =>
          el('div', { className: 'g-row' }, [
            icon('key', 14),
            el('span', { style: 'margin-left:7px', textContent: record.title }),
            record.username
              ? el('span', { style: 'margin-left:8px;color:var(--text-3);font-size:12px',
                             textContent: record.username })
              : null,
          ]))),
      );
      if (fresh.length > 12) {
        body.append(el('div', { className: 'g-foot', textContent: `ほか ${fresh.length - 12} 件` }));
      }
      body.append(el('div', { className: 'g-foot', textContent:
        'すべて「ログイン」として入ります。取り込んだ後で種別を変えられます。'
        + ' 元の CSV はパスワードが平文なので、取り込んだら消してください。' }));
    } else {
      body.append(el('div', { className: 'g-foot', textContent:
        'すべて既にある項目でした。取り込むものはありません。' }));
    }

    dialog.showModal();
  });
}

/// 緊急用のシート。忘れたとき・自分がいなくなったときのための紙。
///
/// このアプリは復旧の窓口を持たない。マスターパスワードを失えば中身は永久に出ない。
/// せめて「これが何で、どこにあって、どう開けるのか」だけは紙に残せるようにする。
function openEmergencyKit() {
  const dialog = makeDialog('緊急用シート', null);
  const body = dialog.querySelector('.dlg-body');
  const where = state.fileHandle ? state.fileName : 'この端末のブラウザの中（ファイルではありません）';
  const opened = window.location.href.split('?')[0];

  body.append(el('div', { className: 'kit' }, [
    el('h2', { textContent: 'PassVault 緊急用シート' }),
    el('p', { textContent:
      'この紙は、パスワードの保管庫を開くための手引きです。'
      + '保管庫そのものは暗号化されていて、下に書く「マスターパスワード」なしには誰にも開けません。' }),

    el('h3', { textContent: '1. 保管庫の場所' }),
    el('div', { className: 'kit-line', textContent: where }),

    el('h3', { textContent: '2. 開き方' }),
    el('div', { className: 'kit-line', textContent: opened }),
    el('p', { textContent:
      'この住所をブラウザで開き、上の保管庫ファイルを選んで、下のマスターパスワードを入れます。'
      + '保管庫ファイル（.pvlt）は、ダブルクリックしても開きません。' }),

    el('h3', { textContent: '3. マスターパスワード' }),
    el('p', { textContent: 'ここに手で書いてください。アプリは決して書き込みません。' }),
    el('div', { className: 'kit-blank' }),
    el('p', { className: 'kit-warn', textContent:
      'これを失うと、中身は永久に取り出せません。復旧の窓口はありません。'
      + 'この紙は、金庫や重要書類と同じ場所に保管してください。' }),

    el('h3', { textContent: '4. 技術的な内容（詳しい人向け）' }),
    el('div', { className: 'kit-line', textContent:
      `形式 PVLT / AES-256-GCM / PBKDF2-HMAC-SHA512 ${state.header.iterations.toLocaleString()} 回` }),
    el('p', { textContent:
      'ファイルの先頭 44 バイトが平文の見出しで、続きが暗号文です。'
      + '仕様は PassVault の README にあります。' }),

    el('div', { className: 'kit-foot', textContent: `作成: ${fmtDateTime(V.isoNoMillis())}` }),
  ]));

  body.append(el('div', { className: 'g-foot', textContent:
    '印刷したら、この画面は閉じてください。画面に出したままにしないこと。' }));

  const head = dialog.querySelector('.dlg-head');
  head.append(el('button', { textContent: '印刷', onclick: () => window.print() }));
  dialog.showModal();
}

async function importBytes(bytes, sourceLabel) {
  let remote;
  try {
    remote = await decryptForeignVault(bytes);
  } catch (caught) {
    toast(`取り込めませんでした: ${caught.message ?? caught}`);
    return false;
  }
  if (!remote) return false;  // パスワードの入力を取り消した

  if (!await confirmMerge(remote, sourceLabel)) {
    toast('取り込みを中止しました');
    return false;
  }

  const summary = await applyMerge(remote);
  if (!summary) return false;
  toast(`取り込みました。${A.summaryText(summary)}`);
  render();
  return true;
}

/// 別の端末の変更が降りてきたときに出す（app.js の pollRemoteChange から）。
///
/// 「あとで」を選んだ版を覚えておく。覚えないと 15 秒ごとに同じことを訊きにくる。
/// さらに新しい版が届けば、改めて訊く。
let ignoredRemoteAt = 0;
hooks.onRemoteChange = async function (when) {
  if (when.getTime() <= ignoredRemoteAt) return false;

  return new Promise(resolve => {
    let answered = false;
    const dialog = makeDialog('別の端末の変更が届いています', null);
    const finish = value => { answered = true; resolve(value); dialog.close(); };
    const later = () => { ignoredRemoteAt = when.getTime(); finish(false); };
    dialog.onDismiss = () => { if (!answered) { ignoredRemoteAt = when.getTime(); resolve(false); } };

    dialog.querySelector('.dlg-body').append(
      el('div', { className: 'banner', style: 'margin-bottom:14px' }, [
        icon('reuse'),
        el('div', {}, [
          el('div', { className: 'bd', textContent:
            `保管庫ファイルが ${fmtDateTime(when.toISOString())} に更新されています。`
            + (state.dirty
                ? 'こちらにも、まだ保存できていない変更があります。'
                : '別の端末での編集が考えられます。') }),
        ]),
      ]),
      el('div', { className: 'group' }, [
        el('button', { className: 'g-row',
          onclick: async () => {
            const bytes = await readVaultFileBytes();
            if (!bytes) { toast('ファイルを読めませんでした'); finish(false); return; }
            dialog.close();
            finish(await importBytes(bytes, `保存先のファイル（${state.fileName}）`));
          } }, [
          el('div', {}, [
            el('div', { style: 'color:var(--accent);font-weight:600', textContent: '取り込む（おすすめ）' }),
            el('div', { className: 'bd', textContent:
              '中身を見せてから、項目ごとに新しい方を残します。取り込む前に内容を確認できます。' }),
          ]),
        ]),
        el('button', { className: 'g-row', onclick: later }, [
          el('div', {}, [
            el('div', { style: 'font-weight:600', textContent: 'あとで' }),
            el('div', { className: 'bd', textContent:
              'この画面は古い内容のままになります。保存しようとしたときに改めて訊きます。' }),
          ]),
        ]),
      ]),
    );
    dialog.showModal();
  });
};

/// 保存しようとしたらファイルが外から変わっていた場合の 3 択
hooks.onConflict = function (message) {
  return new Promise(resolve => {
    let answered = false;
    const dialog = makeDialog('保管庫が外から変更されています', null);
    const finish = value => { answered = true; resolve(value); dialog.close(); };
    dialog.onDismiss = () => { if (!answered) resolve(false); };

    dialog.querySelector('.dlg-body').append(
      el('div', { className: 'banner', style: 'margin-bottom:14px' }, [
        icon('warning'),
        el('div', {}, [
          el('div', { className: 'bd', textContent: message }),
        ]),
      ]),
      el('div', { className: 'group' }, [
        el('button', { className: 'g-row',
          onclick: async () => {
            const bytes = await readVaultFileBytes();
            if (!bytes) { toast('ファイルを読めませんでした'); finish(false); return; }
            dialog.close();
            finish(await importBytes(bytes, `保存先のファイル（${state.fileName}）`));
          } }, [
          el('div', {}, [
            el('div', { style: 'color:var(--accent);font-weight:600', textContent: '取り込む（おすすめ）' }),
            el('div', { className: 'bd', textContent: 'そちらの変更と手元の変更を突き合わせ、項目ごとに新しい方を残します。' }),
          ]),
        ]),
        el('button', { className: 'g-row',
          onclick: async () => { const ok = await forceSave(); render(); finish(ok); } }, [
          el('div', {}, [
            el('div', { style: 'font-weight:600', textContent: '上書きする' }),
            el('div', { className: 'bd', textContent: 'そちらの変更は失われます。' }),
          ]),
        ]),
        el('button', { className: 'g-row',
          onclick: () => { toast('保存しませんでした。変更はまだファイルに書かれていません'); render(); finish(false); } }, [
          el('div', {}, [
            el('div', { style: 'font-weight:600', textContent: '何もしない' }),
            el('div', { className: 'bd', textContent: '手元の変更は保存されないまま残ります。' }),
          ]),
        ]),
      ]),
    );
    dialog.showModal();
  });
};

// ============================================================
// 訊ねるための小さなダイアログ
// ============================================================
//
// ブラウザ標準の prompt / confirm を使わない理由:
// 見た目が揃わないうえ、prompt は環境によっては封じられていて、
// そのとき「欄を追加する」機能そのものが使えなくなる。

/// はい / いいえ を訊く。閉じられた場合は「いいえ」。
hooks.askConfirm = function (title, message, { confirmLabel = 'OK', destructive = false } = {}) {
  return new Promise(resolve => {
    let answered = false;
    const dialog = makeDialog(title, () => { answered = true; resolve(true); return true; }, confirmLabel);
    dialog.onDismiss = () => { if (!answered) resolve(false); };
    if (destructive) dialog.querySelector('.dlg-head button:last-child')?.classList.add('danger');

    dialog.querySelector('.dlg-body').append(
      el('div', { className: 'group' }, [
        el('div', { className: 'g-row' }, [
          el('div', { style: 'line-height:1.65', textContent: message }),
        ]),
      ]),
    );
    dialog.showModal();
  });
};

/// 短い文字列を訊く。空のままなら確定させない。閉じられた場合は null。
hooks.askText = function (title, label, { placeholder = '', initial = '', confirmLabel = '追加' } = {}) {
  return new Promise(resolve => {
    const input = el('input', { className: 'field', value: initial, placeholder });
    let answered = false;
    const dialog = makeDialog(title, () => {
      const value = input.value.trim();
      if (!value) return false;   // 空では閉じない
      answered = true;
      resolve(value);
      return true;
    }, confirmLabel);
    dialog.onDismiss = () => { if (!answered) resolve(null); };

    dialog.querySelector('.dlg-body').append(
      el('div', { className: 'group' }, [
        el('div', { className: 'g-row' }, [
          el('span', { className: 'g-lab', textContent: label }),
          input,
        ]),
      ]),
    );
    input.onkeydown = event => {
      if (event.key === 'Enter') dialog.querySelector('.dlg-head button:last-child')?.click();
    };
    dialog.showModal();
    setTimeout(() => input.focus(), 0);
  });
};

// ============================================================
// ダイアログの枠
// ============================================================

function makeDialog(title, onConfirm, confirmLabel = '保存') {
  const dialog = el('dialog');
  const confirmButton = onConfirm
    ? el('button', { textContent: confirmLabel, onclick: async () => {
        if (await onConfirm() !== false) dialog.close();
      } })
    : el('span', { style: 'width:44px' });

  dialog.append(
    el('div', { className: 'dlg-head' }, [
      el('button', { textContent: onConfirm ? 'キャンセル' : '閉じる', onclick: () => dialog.close() }),
      el('h2', { textContent: title }),
      confirmButton,
    ]),
    el('div', { className: 'dlg-body' }),
  );

  // ダイアログを開いている間は画面を触らない時間が続くので、自動施錠を止める。
  state.holds += 1;

  // 後始末を close イベント任せにしない。
  // 環境によっては <dialog> の close/cancel が飛んでこないことがあり、
  // そうなると holds が減らないまま自動施錠が永久に止まる。
  // close() を包んで、確実に一度だけ後始末する。
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    state.holds = Math.max(0, state.holds - 1);
    noteActivity();
    dialog.remove();
    dialog.onDismiss?.();
  };
  const nativeClose = dialog.close.bind(dialog);
  dialog.close = (...args) => {
    try { nativeClose(...args); } finally { finish(); }
  };
  // Esc で閉じられた場合の保険（発火する環境ではこちらが働く）
  dialog.addEventListener('cancel', finish);
  dialog.addEventListener('close', finish);

  document.body.append(dialog);
  return dialog;
}

render();
